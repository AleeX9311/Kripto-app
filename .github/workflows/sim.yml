name: Paper simulation

on:
  schedule:
    # GitHub's shortest schedule. Each run then scans several times inside the window.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # Separate from sol-desk-data so the two paper books can publish at the same time.
  group: sim-data
  cancel-in-progress: false

jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - name: Load state from sim-data
        run: |
          set -euo pipefail
          if git fetch --depth=1 origin sim-data; then
            git show FETCH_HEAD:state.json > sim/state.json
            if git cat-file -e FETCH_HEAD:learning.json 2>/dev/null; then
              git show FETCH_HEAD:learning.json > sim/learning.json
              echo "Loaded learning.json from sim-data"
            fi
            echo "Loaded state.json from sim-data"
          else
            cp sim/seed-state.json sim/state.json
            echo "sim-data is missing — seeded from sim/seed-state.json"
          fi

      - name: Scan about once a minute
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish() {
            test -f sim/state.json
            test -f sim/status.json
            WT="${RUNNER_TEMP}/sim-data-wt"
            if [ ! -e "$WT/.git" ]; then
              rm -rf "$WT"
              if git fetch --depth=1 origin sim-data; then
                git worktree add -B sim-data "$WT" FETCH_HEAD
              else
                git worktree add --detach "$WT" HEAD
                git -C "$WT" switch --orphan sim-data
                git -C "$WT" rm -rf --cached . >/dev/null 2>&1 || true
              fi
            fi
            cp sim/state.json "$WT/state.json"
            cp sim/status.json "$WT/status.json"
            if [ -f sim/learning.json ]; then
              cp sim/learning.json "$WT/learning.json"
            fi
            if [ -d sim/reports ]; then
              mkdir -p "$WT/reports"
              cp -a sim/reports/. "$WT/reports/"
            fi
            git -C "$WT" add -- state.json status.json learning.json
            if [ -d "$WT/reports" ]; then
              git -C "$WT" add -- reports
            fi
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                state.json|status.json|learning.json|reports/*) ;;
                *) echo "Refusing to publish unexpected file: $f"; exit 1 ;;
              esac
            done < <(git -C "$WT" ls-files)
            if git -C "$WT" diff --cached --quiet; then
              echo "No snapshot changes"
              return 0
            fi
            git -C "$WT" commit -m "Update paper simulation snapshot"
            git -C "$WT" push origin HEAD:sim-data
          }

          # About 5h50m of scans. */5 cron only restarts the chain if this job dies.
          deadline=$((SECONDS + 348 * 60))
          last_pub=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            echo "=== scan $(date -u +%H:%M:%S) ==="
            python3 sim/trader.py || echo "pass failed — backing off"
            if [ $((SECONDS - last_pub)) -ge 90 ]; then
              publish || echo "publish skipped"
              last_pub=$SECONDS
            fi
            sleep 45
          done
          publish || echo "final publish skipped"
          gh workflow run "Paper simulation" --ref main || echo "re-dispatch failed; the */5 cron is the backup"
