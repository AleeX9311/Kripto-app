<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Agenti" />
  <meta name="description" content="Papirna simulacija — virtualni denar, brez pravih naročil" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <title>AGENTI DESK</title>
  <style>
    :root {
      --bg: #000;
      --mag: #ff3ad4;
      --pur: #b44dff;
      --blue: #7aa2ff;
      --ora: #ff9a1f;
      --grn: #39ff7a;
      --red: #ff3355;
      --yel: #ffb020;
      --dim: #7d8b9a;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --orbit: 78px;
    }
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #000; color: #e8f3ff; }
    body {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      line-height: 1.25;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding:
        calc(6px + var(--safe-t))
        calc(8px + var(--safe-r))
        calc(8px + var(--safe-b))
        calc(8px + var(--safe-l));
      -webkit-tap-highlight-color: transparent;
    }
    button, input { font-family: inherit; color: inherit; }
    button { touch-action: manipulation; }
    #fx {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 1; pointer-events: none;
    }
    .top, .desk, .err, #toast { position: relative; z-index: 2; }
    .top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 10px;
      align-items: center;
      margin-bottom: 6px;
      flex: none;
    }
    .brand {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      letter-spacing: .16em;
      font-size: 13px;
      color: #fff;
    }
    .brand span { color: #d7e6ff; text-shadow: 0 0 10px rgba(122, 162, 255, .8); }
    .clock {
      font-size: 16px;
      letter-spacing: .08em;
      color: #fff;
      text-shadow: 0 0 10px rgba(180, 77, 255, .7);
    }
    .sim {
      grid-column: 1 / -1;
      color: var(--ora);
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: 9px;
      font-weight: 700;
    }
    .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--dim); font-size: 9px; letter-spacing: .06em; }
    .meta button, .chip {
      background: transparent;
      border: 1px solid rgba(180, 77, 255, .55);
      color: #e7d6ff;
      border-radius: 999px;
      padding: 2px 8px;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: 9px;
    }
    #age.stale { color: var(--ora); }
    .err {
      margin: 0 0 6px;
      color: var(--red);
      border: 1px solid rgba(255, 51, 85, .7);
      padding: 4px 8px;
      font-size: 10px;
    }
    .desk {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) minmax(150px, 30vh) minmax(0, 1fr);
      gap: 10px;
    }
    .heat { grid-column: 1; grid-row: 1; }
    .agents { grid-column: 2; grid-row: 1; }
    .eq { grid-column: 3; grid-row: 1; }
    .core { grid-column: 1 / -1; grid-row: 2; }
    .value { grid-column: 1; grid-row: 3; }
    .result { grid-column: 2; grid-row: 3; }
    .tape { grid-column: 3; grid-row: 3; }
    .panel {
      background: rgba(3, 3, 8, .86);
      border: 1px solid rgba(160, 70, 255, .38);
      box-shadow: inset 0 0 28px rgba(90, 20, 160, .14);
      border-radius: 10px;
      padding: 8px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .heat { border-color: rgba(255, 58, 212, .45); }
    .agents { border-color: rgba(122, 162, 255, .45); }
    .eq { border-color: rgba(255, 176, 32, .4); }
    .value { border-color: rgba(57, 255, 122, .35); }
    .result { border-color: rgba(255, 154, 31, .4); }
    .tape { border-color: rgba(255, 78, 205, .45); }
    .panel h2 {
      margin: 0 0 6px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #b9dcff;
      flex: none;
    }
    .scroller { overflow: auto; min-height: 0; flex: 1; }
    .surface { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; height: 36px; margin-bottom: 6px; flex: none; }
    .surface button { border: 0; padding: 0; border-radius: 2px; min-width: 0; background: #14141c; }
    .hrow, .frow {
      display: grid;
      gap: 4px;
      align-items: center;
      padding: 2px 0;
      border-bottom: 1px solid rgba(255, 255, 255, .04);
      font-size: 9px;
    }
    .hrow { grid-template-columns: 1.15fr .55fr .7fr .75fr .8fr; }
    .hrow.head { color: var(--dim); letter-spacing: .08em; }
    button.hrow, button.frow {
      appearance: none;
      background: transparent;
      color: inherit;
      border: 0;
      text-align: left;
      padding: 3px 0;
      width: 100%;
      display: grid;
    }
    .frow { grid-template-columns: 40px 28px 68px 34px minmax(0, 1fr); cursor: pointer; }
    .frow span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .up { color: var(--grn); }
    .dn { color: var(--red); }
    .dim { color: var(--dim); }
    .empty { color: var(--dim); padding: 8px 0; }
    .rule { margin: 6px 0 0; color: #c9b6ff; font-size: 8px; letter-spacing: .04em; line-height: 1.35; flex: none; }
    .arow { display: grid; grid-template-columns: 78px minmax(0, 1fr) 38px; gap: 6px; align-items: center; margin: 3px 0; }
    .arow b { font-size: 9px; letter-spacing: .06em; }
    .track { height: 5px; background: #120814; border-radius: 99px; overflow: hidden; }
    .track i { display: block; height: 100%; border-radius: 99px; }
    .spark { display: block; width: 100%; height: 14px; margin-top: 2px; }
    .mega {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: clamp(26px, 3.2vw, 54px);
      letter-spacing: -.03em;
      line-height: .95;
      color: #f6fff9;
      text-shadow: 0 0 18px rgba(57, 255, 122, .28);
      flex: none;
    }
    .mega.dn { color: #ffe4ea; text-shadow: 0 0 18px rgba(255, 51, 85, .35); }
    .pct { margin: 4px 0; font-size: 12px; letter-spacing: .04em; flex: none; }
    .fine { margin: 4px 0 0; color: var(--dim); font-size: 9px; flex: none; }
    .chartbox { position: relative; flex: 1; min-height: 56px; }
    .chartbox.short { flex: none; height: 46px; min-height: 46px; }
    .chartbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .core { position: relative; min-height: 0; }
    .aura {
      position: absolute; left: 50%; top: 50%;
      width: min(240px, 70%); height: min(240px, 90%);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196, 150, 255, .42), rgba(70, 30, 180, .08) 46%, transparent 70%);
      animation: pulse 2.8s ease-in-out infinite;
      pointer-events: none;
    }
    .orb {
      position: absolute; left: 50%; top: 50%;
      width: 112px; height: 112px;
      border: 0; border-radius: 50%; padding: 0;
      transform: translate(-50%, -50%);
      display: flex; align-items: center; justify-content: center; gap: 16px;
      background: radial-gradient(circle at 34% 30%, #fff 0%, #f3f7ff 26%, #c9d7ee 60%, #93a8c8 100%);
      box-shadow: 0 0 22px rgba(230, 240, 255, .9), 0 0 64px rgba(150, 80, 255, .5), 0 0 120px rgba(60, 20, 160, .28);
      animation: bob 3.8s ease-in-out infinite;
      cursor: pointer;
    }
    .orb i { width: 11px; height: 28px; background: #0a0a0c; border-radius: 8px; display: block; }
    .sat {
      position: absolute; left: 50%; top: 50%;
      width: 34px; height: 34px;
      margin: -17px 0 0 -17px;
      border: 0; border-radius: 50%; padding: 0;
      display: flex; align-items: center; justify-content: center; gap: 3px;
      transform: rotate(var(--rot)) translateX(var(--orbit)) rotate(calc(var(--rot) * -1));
      box-shadow: 0 6px 16px rgba(0, 0, 0, .45), inset 0 0 8px rgba(255, 255, 255, .35);
      cursor: pointer;
    }
    .sat em { width: 2px; height: 8px; background: #111; border-radius: 2px; display: block; }
    .sat b { color: #1a0900; font-size: 14px; line-height: 1; }
    .kit { background: radial-gradient(circle at 30% 30%, #f3e8ff, #b44dff 55%, #6d28d9); }
    .trend { background: radial-gradient(circle at 30% 30%, #ffe0f6, #ff4ecd 55%, #c026d3); }
    .varnost { background: radial-gradient(circle at 30% 30%, #ffe7c2, #ff9a1f 52%, #c2410c); }
    .bik { background: radial-gradient(circle at 30% 30%, #ffd0d8, #ff3355 55%, #9f1239); }
    .iz { background: radial-gradient(circle at 30% 30%, #e7fbff, #3df6ff 50%, #0284c7); }
    @keyframes bob {
      0%, 100% { transform: translate(-50%, -50%) translateY(0); }
      50% { transform: translate(-50%, -50%) translateY(-7px); }
    }
    @keyframes pulse {
      50% { transform: translate(-50%, -50%) scale(1.08); opacity: .72; }
    }
    @keyframes spin {
      from { transform: rotate(0deg) translateX(var(--orbit)) rotate(0deg); }
      to { transform: rotate(360deg) translateX(var(--orbit)) rotate(-360deg); }
    }
    @keyframes slide {
      from { transform: translateY(-8px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }
    .frow.new { animation: slide .35s ease; }
    @media (prefers-reduced-motion: no-preference) {
      .sat { animation: spin 22s linear infinite; animation-delay: calc(var(--i) * -4.4s); }
    }
    .back, .sheet { display: none; }
    .back.show {
      display: block; position: fixed; inset: 0; z-index: 20;
      background: rgba(0, 0, 0, .62);
    }
    .sheet.show {
      display: block; position: fixed; z-index: 21;
      left: 0; right: 0; bottom: 0;
      max-height: min(78vh, 720px);
      overflow: auto;
      background: rgba(6, 6, 12, .96);
      border-top: 1px solid rgba(180, 77, 255, .65);
      border-radius: 16px 16px 0 0;
      padding: 12px 14px calc(16px + var(--safe-b));
      box-shadow: 0 -16px 40px rgba(0, 0, 0, .5);
    }
    .sheet h3 { margin: 0 0 8px; font-family: "Space Grotesk", sans-serif; letter-spacing: .06em; }
    .sheet p { margin: 0 0 8px; }
    .grab { width: 36px; height: 4px; border-radius: 4px; background: #334; margin: 0 auto 10px; }
    .level { position: relative; height: 8px; border-radius: 99px; margin: 6px 0; background: linear-gradient(90deg, #ff3355, #333, #39ff7a); }
    .level i { position: absolute; top: -3px; width: 3px; height: 14px; background: #fff; border-radius: 2px; }
    .filters { display: flex; gap: 6px; margin-bottom: 8px; }
    .filters button.on { color: #031; background: var(--grn); border-color: var(--grn); }
    a.link { color: #9ad0ff; }
    #toast {
      position: fixed; left: 50%; bottom: calc(18px + var(--safe-b));
      transform: translateX(-50%);
      z-index: 40;
      background: rgba(8, 10, 18, .94);
      border: 1px solid rgba(57, 255, 122, .5);
      color: #eaffe4;
      border-radius: 999px;
      padding: 8px 14px;
    }
    @media (min-width: 980px) {
      .top { grid-template-columns: auto auto 1fr auto; }
      .sim, .meta { grid-column: auto; }
      .meta { justify-content: flex-end; }
    }
    @media (orientation: landscape) and (max-height: 520px) {
      .desk { grid-template-rows: minmax(0, 1fr) minmax(104px, 34vh) minmax(0, 1fr); gap: 6px; }
      .orb { width: 74px; height: 74px; gap: 10px; }
      .orb i { width: 8px; height: 18px; }
      .aura { width: 150px; height: 150px; }
      .sat { width: 24px; height: 24px; margin: -12px 0 0 -12px; }
      .sat em { height: 6px; }
      .core { --orbit: 50px; }
      .mega { font-size: 22px; }
      .top { margin-bottom: 4px; }
      .spark { display: none; }
      .arow { margin: 1px 0; }
      .panel { padding: 5px 6px; }
      .rule { font-size: 7px; }
    }
    @media (orientation: portrait) and (max-width: 900px) {
      html, body { height: auto; overflow: auto; }
      body { display: block; }
      .desk {
        display: grid;
        height: auto;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: minmax(280px, 46vh) auto auto auto auto;
        gap: 8px;
      }
      .core { grid-column: 1 / -1; grid-row: 1; min-height: 280px; --orbit: 88px; }
      .heat { grid-column: 1 / -1; grid-row: 2; max-height: none; }
      .agents { grid-column: 1; grid-row: 3; }
      .eq { grid-column: 2; grid-row: 3; min-height: 190px; }
      .value { grid-column: 1; grid-row: 4; }
      .result { grid-column: 2; grid-row: 4; }
      .tape { grid-column: 1 / -1; grid-row: 5; max-height: 320px; }
      .panel { cursor: pointer; }
    }
    @media (prefers-reduced-motion: reduce) {
      .orb, .aura, .sat, .frow.new { animation: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <header class="top">
    <div class="brand">KRIPTO <span>AGENTI</span></div>
    <div class="clock" id="clock">00:00:00</div>
    <div class="sim">SIMULACIJA · virtualni denar</div>
    <div class="meta">
      <span id="scanned">PREGLEDANIH —</span>
      <span id="age">ZADNJI PREGLED —</span>
      <button type="button" id="infoBtn" data-sheet="info">INFO</button>
    </div>
  </header>
  <p class="err" id="error" hidden></p>
  <main class="desk">
    <section class="panel heat" data-sheet="heat">
      <h2>Kandidati</h2>
      <div class="surface" id="surface"></div>
      <div class="scroller" id="heatTable"></div>
    </section>
    <section class="panel agents" data-sheet="agents">
      <h2>Agenti</h2>
      <div class="scroller" id="agentBars"></div>
      <p class="rule">potrebni vsaj 4/5 glasovi, VARNOST mora vedno odobriti</p>
    </section>
    <section class="panel eq" data-sheet="equity">
      <h2>Krivulja</h2>
      <div class="chartbox"><canvas id="eqLine"></canvas></div>
    </section>
    <div class="core" id="core">
      <div class="aura"></div>
      <button type="button" class="orb" data-sheet="agents" aria-label="Koordinator"><i></i><i></i></button>
      <button type="button" class="sat kit" data-agent="kit" style="--i:0;--rot:210deg" aria-label="KIT"><em></em><em></em></button>
      <button type="button" class="sat trend" data-agent="trend" style="--i:1;--rot:282deg" aria-label="TREND"><em></em><em></em></button>
      <button type="button" class="sat varnost" data-agent="varnost" style="--i:2;--rot:354deg" aria-label="VARNOST"><b>V</b></button>
      <button type="button" class="sat bik" data-agent="bik_medved" style="--i:3;--rot:66deg" aria-label="BIK MEDVED"><em></em><em></em></button>
      <button type="button" class="sat iz" data-agent="izvajanje" style="--i:4;--rot:138deg" aria-label="IZVAJANJE"><em></em><em></em></button>
    </div>
    <section class="panel value" data-sheet="positions">
      <h2>Vrednost</h2>
      <div class="mega" id="bigEur">—</div>
      <div class="pct" id="bigPct">—</div>
      <div class="chartbox short"><canvas id="eqBars"></canvas></div>
      <p class="fine" id="openLine">odprte —</p>
    </section>
    <section class="panel result" data-sheet="history">
      <h2>Izid</h2>
      <div class="mega" id="bigPnl">—</div>
      <div class="pct" id="winLine">—</div>
      <div class="chartbox short"><canvas id="pnlLine"></canvas></div>
    </section>
    <section class="panel tape" data-sheet="tape">
      <h2>Trak</h2>
      <div class="scroller feed" id="feed"></div>
    </section>
  </main>
  <div class="back" id="back"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div id="toast" hidden></div>
<script>
(function () {
  "use strict";
  const STATUS_URL = "https://raw.githubusercontent.com/AleeX9311/Kripto-app/sim-data/status.json";
  const AGENTS = [
    { id: "kit", label: "KIT", color: "#b44dff", about: "Koncentracija nakupov v zadnjih minutah." },
    { id: "trend", label: "TREND", color: "#ff4ecd", about: "Momentum in promet." },
    { id: "varnost", label: "VARNOST", color: "#ff9a1f", about: "GoPlus, mint, freeze in imetniki. Obvezna odobritev." },
    { id: "bik_medved", label: "BIK/MEDVED", color: "#ff3355", about: "Obrat navzdol in pregretje." },
    { id: "izvajanje", label: "IZVAJANJE", color: "#3df6ff", about: "Pot na borzi in ocena zdrsa." }
  ];
  const RULE = "Potrebni vsaj 4/5 glasovi, VARNOST mora vedno odobriti.";
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let data = null;
  let loading = false;
  let histChain = "all";
  let sheetKind = null;
  let prevFeed = null;
  let eurShown = null;
  let eurTarget = null;
  let raf = 0;
  let boltBucket = -1;
  let looping = false;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function safeUrl(u) {
    try {
      const url = new URL(String(u));
      if (url.protocol === "https:" && url.hostname === "dexscreener.com") return url.href;
    } catch (_) {}
    return "";
  }
  function num(n) { const v = Number(n); return Number.isFinite(v) ? v : null; }
  function money(n) {
    const v = num(n);
    if (v == null) return "—";
    return "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function eur(n) {
    const v = num(n);
    if (v == null) return "—";
    return v.toLocaleString("sl-SI", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }
  function pct(n) {
    const v = num(n);
    if (v == null) return "—";
    const body = v.toLocaleString("sl-SI", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (v > 0 ? "+" : "") + body + " %";
  }
  function compact(n) {
    const v = num(n);
    if (v == null) return "—";
    const a = Math.abs(v);
    if (a >= 1e6) return "$" + (v / 1e6).toLocaleString("en-US", { maximumFractionDigits: 2 }) + "M";
    if (a >= 1e3) return "$" + (v / 1e3).toLocaleString("en-US", { maximumFractionDigits: 1 }) + "k";
    return "$" + v.toLocaleString("en-US", { maximumFractionDigits: 0 });
  }
  function fmtPx(n) {
    const v = num(n);
    if (v == null) return "—";
    if (v >= 1) return v.toLocaleString("en-US", { maximumFractionDigits: 4 });
    return v.toPrecision(4);
  }
  function chainOf(x) { return x && (x.chain === "solana" || x.chain === "SOL") ? "SOL" : (x && x.chain ? "BSC" : ""); }
  function tags(c) { return [chainOf(c), c.category || ""].filter(Boolean).join(" · "); }
  function yesCount(votes) {
    return AGENTS.reduce((n, a) => n + ((votes && votes[a.id] && votes[a.id].vote === "YES") ? 1 : 0), 0);
  }
  function heatFill(v) {
    const n = num(v);
    if (n == null) return "#16161e";
    const t = Math.max(-40, Math.min(40, n)) / 40;
    if (t >= 0) return "rgb(" + Math.round(18 + (1 - t) * 24) + "," + Math.round(48 + t * 170) + "," + Math.round(36 + t * 30) + ")";
    return "rgb(" + Math.round(70 + -t * 165) + "," + Math.round(22 + (1 + t) * 16) + ",42)";
  }
  function left4h(iso) {
    const t = new Date(iso || "").getTime();
    if (!Number.isFinite(t)) return "—";
    const ms = t + 4 * 3600 * 1000 - Date.now();
    if (ms <= 0) return "časovni izhod";
    const m = Math.floor(ms / 60000);
    return Math.floor(m / 60) + " h " + (m % 60) + " min";
  }
  function clock() {
    const p = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Europe/Ljubljana", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
    }).formatToParts(new Date());
    const g = (t) => p.find((x) => x.type === t).value;

      if (rnd() < 0.3 && s.gen < 3) {
        const ang = Math.atan2(dy, dx) + (rnd() - 0.5) * 1.4;
        const bl = len * (0.18 + rnd() * 0.2);
        segs.push({ x1: mx, y1: my, x2: mx + Math.cos(ang) * bl, y2: my + Math.sin(ang) * bl, w: s.w * 0.65, gen: s.gen + 2 });
      }
    }
    g.globalAlpha = 1;
  }
  function drawLightning(seed) {
    const canvas = $("fx");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    const W = Math.floor(w * dpr), H = Math.floor(h * dpr);
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    const g = canvas.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const core = $("core");
    if (!core) return;
    const cr = core.getBoundingClientRect();
    const cx = cr.left + cr.width / 2;
    const cy = cr.top + cr.height / 2;
    let s = seed || 1;
    const rnd = () => { s = (Math.imul(s, 16807) + 11) % 2147483647; return s / 2147483647; };
    const colors = ["#ff3ad4", "#ff4ecd", "#7aa2ff", "#d6b4ff", "#f4fbff"];
    g.lineCap = "round";
    g.globalCompositeOperation = "lighter";
    document.querySelectorAll(".panel").forEach((el, i) => {
      const r = el.getBoundingClientRect();
      if (r.bottom < 0 || r.top > h || r.right < 0 || r.left > w) return;
      const ax = Math.max(r.left + 6, Math.min(cx, r.right - 6));
      const ay = Math.max(r.top + 6, Math.min(cy, r.bottom - 6));
      bolt(g, rnd, cx, cy, ax, ay, colors[i % colors.length], reduce ? 0.04 : 0.26);
      const ax2 = r.left + r.width * (0.25 + (i % 3) * 0.22);
      const ay2 = cy < r.top + 4 ? r.top + 4 : (cy > r.bottom - 4 ? r.bottom - 4 : ay);
      bolt(g, rnd, cx, cy, ax2, ay2, colors[(i + 2) % colors.length], reduce ? 0.03 : 0.2);
    });
    if (!reduce) {
      for (let k = 0; k < 3; k++) {
        const ang = rnd() * Math.PI * 2;
        const len = 36 + rnd() * 54;
        bolt(g, rnd, cx, cy, cx + Math.cos(ang) * len, cy + Math.sin(ang) * len, colors[k], 0.3);
      }
    }
    g.globalCompositeOperation = "source-over";
    g.globalAlpha = 1;
  }
  function frame(ts) {
    if (!looping) return;
    const bucket = Math.floor(ts / 90);
    if (bucket !== boltBucket) {
      boltBucket = bucket;
      drawLightning(bucket * 17 + 3);
    }
    raf = requestAnimationFrame(frame);
  }
  function startLoop() {
    if (reduce || looping) return;
    looping = true;
    raf = requestAnimationFrame(frame);
  }
  function stopLoop() { looping = false; if (raf) cancelAnimationFrame(raf); }
  async function load() {
    if (loading) return;
    loading = true;
    try {
      const res = await fetch(STATUS_URL + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const json = await res.json();
      if (!json || json.note !== "SIMULACIJA") throw new Error("posnetek");
      render(json);
      $("error").hidden = true;
    } catch (_) {
      $("error").hidden = false;
      $("error").textContent = data ? "Zadnje osveževanje ni uspelo. Prikazan je prejšnji posnetek." : "Posnetka še ni. Čaka na signal.";
    } finally {
      loading = false;
    }
  }
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-close]") || e.target.id === "back") { closeSheet(); return; }
    const chain = e.target.closest("[data-chain]");
    if (chain && sheetKind === "history") { histChain = chain.dataset.chain; paintSheet(); return; }
    const cand = e.target.closest("[data-cand]");
    if (cand && data) {
      openSheet("token", { token: (data.candidates || [])[Number(cand.dataset.cand)] });
      return;
    }
    const agent = e.target.closest("[data-agent]");
    if (agent) { openSheet("agents", { agent: agent.dataset.agent }); return; }
    const panel = e.target.closest("[data-sheet]");
    if (panel) openSheet(panel.dataset.sheet);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
  let pullY = 0;
  window.addEventListener("touchstart", (e) => { if (window.scrollY <= 2) pullY = e.touches[0].clientY; }, { passive: true });
  window.addEventListener("touchend", (e) => {
    if (window.scrollY <= 2 && pullY && e.changedTouches[0].clientY - pullY > 72) load();
    pullY = 0;
  });
  window.addEventListener("resize", () => { boltBucket = -1; drawLightning(reduce ? 1 : 9); drawCharts(); });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") stopLoop();
    else { startLoop(); load(); }
  });
  if (reduce) {
    drawLightning(1);
    window.addEventListener("scroll", () => drawLightning(1), { passive: true });
  } else startLoop();
  clock();
  setInterval(clock, 1000);
  setInterval(() => { if (document.visibilityState === "visible") load(); }, 20000);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
  load();
})();
</script>
