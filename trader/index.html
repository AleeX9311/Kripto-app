<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05060a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Agenti" />
  <meta name="description" content="Kripto Agenti Desk — simulacija, virtualni denar" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <title>KRIPTO AGENTI DESK</title>
  <style>
    :root {
      --bg: #05060a;
      --panel: #0a0d14;
      --line: rgba(120, 140, 255, .22);
      --green: #39ff88;
      --red: #ff3b5c;
      --mag: #ff3df2;
      --yel: #ffd23f;
      --cyan: #3de0ff;
      --muted: rgba(176, 192, 220, .62);
      --text: #e7eefc;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
    body { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    button { font-family: inherit; color: inherit; background: transparent; border: 0; padding: 0; cursor: pointer; }
    #fit {
      width: 100vw; height: 100dvh;
      display: grid; place-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #scaler { position: relative; overflow: hidden; }
    #board {
      position: absolute; left: 0; top: 0;
      width: 390px; height: 844px;
      transform-origin: 0 0;
      background:
        radial-gradient(420px 280px at 50% 42%, rgba(80, 40, 140, .18), transparent 70%),
        var(--bg);
      display: flex; flex-direction: column; gap: 4px;
      padding: 5px;
      color: var(--text);
      font-size: 10px;
    }
    #board.wide { width: 1440px; height: 900px; padding: 10px; gap: 6px; font-size: 12px; }
    .top { height: 70px; flex: none; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .toprow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .logo { font-family: "Space Grotesk", sans-serif; font-weight: 700; letter-spacing: .08em; font-size: 12px; line-height: 1; }
    .logo small { display: block; margin-top: 2px; font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 7px; letter-spacing: .14em; color: var(--muted); }
    .clockbox { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
    .clock { font-size: 16px; letter-spacing: .06em; text-align: right; color: #fff; line-height: 1; }
    .clockmeta { display: flex; gap: 3px; align-items: center; }
    .navline, .statline { display: flex; align-items: center; gap: 3px; min-width: 0; overflow: hidden; }
    .navline button.nav { font-size: 7px; letter-spacing: .12em; color: var(--cyan); padding: 2px 0; }
    .stat, .pill {
      border: 1px solid var(--line);
      background: rgba(8, 12, 22, .9);
      border-radius: 2px;
      padding: 1px 4px;
      font-size: 7px;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .stat b { color: #fff; font-weight: 600; }
    .stat.up b { color: var(--green); }
    .stat.dn b { color: var(--red); }
    .pill.live { color: #04140c; background: var(--green); border-color: var(--green); font-weight: 700; letter-spacing: .08em; }
    .pill.wait { color: var(--yel); }
    .pill, .stat { flex: none; }
    .tick {
      height: 16px; flex: none;
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      color: var(--muted); font-size: 7px; letter-spacing: .08em;
      display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap;
      text-transform: uppercase;
    }
    .tick b { color: var(--yel); font-weight: 600; }
    .tri { height: 136px; flex: none; display: grid; grid-template-columns: 1fr 1.12fr 1fr; gap: 4px; min-height: 0; }
    .mid { height: 268px; flex: none; display: grid; grid-template-columns: 74px 1fr 124px; gap: 4px; min-height: 0; position: relative; z-index: 2; }
    .pipe { height: 26px; flex: none; position: relative; z-index: 8; display: flex; align-items: center; gap: 5px; flex-wrap: nowrap; }
    .pipe .wire { position: absolute; left: 8px; right: 8px; top: 50%; height: 1px; background: linear-gradient(90deg, #ff3df2, #ffb020, #ff3b5c, #39ff88, #3de0ff); opacity: .7; }
    .pipe button {
      position: relative; z-index: 1; flex: 1; min-width: 0;
      border: 1px solid var(--line); background: #0b101a;
      border-radius: 99px; font-size: 7px; letter-spacing: .04em;
      padding: 3px 2px; color: var(--muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pipe button.hot { color: #fff; border-color: var(--green); box-shadow: 0 0 0 1px rgba(57,255,136,.4), 0 0 10px rgba(57,255,136,.45); }
    .bot { flex: 1; min-height: 0; display: grid; grid-template-columns: 132px 1fr; gap: 4px; }
    .panel {
      background: rgba(10, 13, 20, .9);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 4px 5px 3px;
      min-width: 0; min-height: 0; overflow: hidden;
      display: flex; flex-direction: column;
      position: relative; z-index: 3;
    }
    .syn { background: transparent; border-color: transparent; z-index: 6; pointer-events: none; }
    .panel h2 {
      margin: 0 0 2px; flex: none;
      font-family: "Space Grotesk", sans-serif;
      font-size: 8px; font-weight: 500; letter-spacing: .16em;
      text-transform: uppercase; color: rgba(186, 204, 240, .78);
    }
    canvas.plot { width: 100%; flex: 1; min-height: 0; display: block; }
    canvas.thin { height: 28px; flex: none; width: 100%; }
    .hint { margin: 0; flex: none; font-size: 6px; letter-spacing: .06em; color: var(--yel); text-transform: uppercase; }
    .srow, .prow {
      display: grid; gap: 3px; align-items: center;
      font-size: 7px; line-height: 1.15; padding: 1px 0;
      border-bottom: 1px solid rgba(255,255,255,.04);
      width: 100%; text-align: left;
    }
    .srow { grid-template-columns: 5px 30px minmax(0, 1fr) auto; }
    .dot { width: 5px; height: 5px; border-radius: 50%; display: block; }
    .up { color: var(--green); }
    .dn { color: var(--red); }
    .dim { color: var(--muted); }
    .tag { font-size: 6px; letter-spacing: .04em; color: var(--cyan); }
    .pcard { border-top: 1px solid rgba(255,255,255,.06); padding: 2px 0 1px; min-width: 0; }
    .pcard .nm, .pcard .px {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 9px; line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pcard .nm { display: flex; justify-content: space-between; gap: 4px; }
    .pcard canvas { width: 100%; height: 14px; display: block; }
    .pnlhead { display: flex; flex-direction: column; gap: 2px; flex: none; }
    .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 6px; font-size: 8px; color: var(--muted); letter-spacing: .04em; }
    .statgrid b { display: block; color: #fff; font-size: 10px; font-weight: 600; }
    .statgrid .up b { color: var(--green); }
    .statgrid .dn b { color: var(--red); }
    .crow { display: grid; grid-template-columns: 46px 1fr 42px; gap: 3px; align-items: center; font-size: 8px; line-height: 1.2; }
    .crow i { display: block; height: 6px; border-radius: 1px; }
    #classBars { flex: none; overflow: hidden; }
    .huge {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700; font-size: 26px; letter-spacing: -.04em; line-height: .9;
      color: var(--green); text-shadow: 0 0 16px rgba(57,255,136,.25);
    }
    .huge.dn { color: var(--red); text-shadow: 0 0 16px rgba(255,59,92,.3); }
    .sub { font-size: 7px; color: var(--muted); margin: 2px 0 3px; letter-spacing: .04em; }
    .trakrow { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 86px; gap: 3px; }
    .ladder { overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; gap: 1px; min-height: 0; }
    .lad { display: grid; grid-template-columns: 46px 1fr; gap: 2px; align-items: center; font-size: 7px; line-height: 1; min-width: 0; }
    .lad span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lad i { display: block; height: 7px; border-radius: 1px; justify-self: end; }
    .ladder i { display: block; height: 6px; border-radius: 1px; opacity: .9; }
    #fx {
      position: absolute; left: 0; z-index: 5; pointer-events: none;
    }
    #actors { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
    .chipcard {
      position: absolute; pointer-events: auto;
      background: rgba(6, 8, 14, .88);
      border: 1px solid var(--line);
      border-radius: 3px; padding: 2px 4px; text-align: left;
      min-width: 54px; transform: translate(-50%, -50%);
    }
    .chipcard b { display: block; font-size: 7px; letter-spacing: .08em; }
    .chipcard span { display: block; font-size: 6px; color: var(--muted); white-space: nowrap; }
    .sheet, .back { display: none; }
    .back.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 30; }
    .sheet.show {
      display: block; position: fixed; z-index: 31; inset: 0;
      background: #070910; color: var(--text);
      overflow: auto;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
      font-size: 13px;
    }
    .sheet h3 { font-family: "Space Grotesk", sans-serif; letter-spacing: .06em; margin: 12px 0 6px; }
    .sheet p { margin: 0 0 8px; }
    .sheet .chip { border: 1px solid var(--line); border-radius: 99px; padding: 4px 8px; margin: 0 6px 6px 0; font-size: 11px; }
    .level { position: relative; height: 8px; border-radius: 99px; margin: 4px 0 8px; background: linear-gradient(90deg, var(--red), #333, var(--green)); }
    .level i { position: absolute; top: -3px; width: 3px; height: 14px; background: #fff; }
    #toast {
      position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom));
      transform: translateX(-50%); z-index: 40; display: none;
      background: #0c1210; border: 1px solid var(--green); color: var(--green);
      border-radius: 99px; padding: 8px 12px; font-size: 12px;
    }
    #toast.show { display: block; }
    .wide .logo { font-size: 20px; }
    .wide .logo small { font-size: 10px; }
    .wide .clock { font-size: 28px; }
    .wide .top { height: 78px; }
    .wide .tri { height: 188px; }
    .wide .mid { height: 340px; grid-template-columns: 220px 1fr 280px; }
    .wide .navline button.nav, .wide .stat, .wide .pill { font-size: 11px; padding: 3px 8px; }
    .wide .tick { height: 22px; font-size: 11px; }
    .wide .srow { font-size: 11px; grid-template-columns: 8px 52px minmax(0,1fr) auto auto; padding: 3px 0; }
    .wide .pipe { height: 34px; }
    .wide .pipe button { font-size: 11px; }
    .wide .bot { grid-template-columns: 380px 1fr; }
    .wide .panel { padding: 8px 10px; }
    .wide .panel h2 { font-size: 11px; margin-bottom: 6px; }
    .wide .hint, .wide .sub, .wide .tag { font-size: 10px; }
    .wide .huge { font-size: 42px; }
    .wide .pnlhead { flex-direction: row; align-items: flex-end; gap: 12px; }
    .wide .statgrid { font-size: 11px; }
    .wide .statgrid b { font-size: 14px; }
    .wide .crow { font-size: 11px; grid-template-columns: 72px 1fr 64px; }
    .wide .pcard .nm, .wide .pcard .px { font-size: 11px; }
    .wide .lad { font-size: 10px; grid-template-columns: 72px 1fr; }
    .wide .chipcard b { font-size: 11px; }
    .wide .chipcard span { font-size: 10px; }
    .wide .chipcard { min-width: 92px; padding: 4px 8px; }
    .wide canvas.thin { height: 42px; }
    .wide .ladder { width: auto; }
    .wide .trakrow { grid-template-columns: 1fr 160px; }
    .wide .pcard .nm { font-size: 12px; }
    .wide .pcard canvas { height: 28px; }
    @media (prefers-reduced-motion: reduce) {
      .tick b { animation: none; }
    }
  </style>
</head>
<body>
  <div id="fit">
    <div id="scaler">
      <div id="board">
        <header class="top">
          <div class="toprow">
            <div class="logo">KRIPTO AGENTI DESK<small>PAPIRNA KNJIGA · BREZ PRAVEGA DENARJA</small></div>
            <div class="clockbox">
              <div class="clock" id="clock">00:00:00</div>
              <div class="clockmeta">
                <span class="pill" id="stBsc">BSC</span>
                <span class="pill" id="stSol">SOL</span>
                <span class="pill wait" id="roj">ROJ ČAKA</span>
              </div>
            </div>
          </div>
          <div class="navline">
            <button class="nav" type="button" data-sheet="agents">SINAPSA</button>
            <button class="nav" type="button" data-sheet="trak">TRAK</button>
            <button class="nav" type="button" data-sheet="knjiga">KNJIGA</button>
          </div>
          <div class="statline">
            <span class="stat" id="stEq">—</span>
            <span class="stat" id="stPnl">—</span>
            <span class="stat" id="stN">—</span>
            <span class="stat" id="stWin">—</span>
          </div>
        </header>
        <div class="tick" id="tick">5 AGENTOV LIVE · SAMO SIMULACIJA</div>
        <div class="tri">
          <section class="panel" data-sheet="signal">
            <h2>Signal rotacija</h2>
            <canvas class="plot" id="rot"></canvas>
            <canvas class="thin" id="stack"></canvas>
          </section>
          <section class="panel" data-sheet="sled">
            <h2>Sled</h2>
            <div id="sled" style="overflow:hidden;flex:1"></div>
          </section>
          <section class="panel" data-sheet="cenilec">
            <h2>Cenilec</h2>
            <canvas class="plot" id="fan"></canvas>
            <p class="hint" id="fanHint">RAZPRŠITEV IZ NIHANJA · NI NAPOVED</p>
          </section>
        </div>
        <div class="mid">
          <section class="panel" data-sheet="senzor">
            <h2>Senzorni center</h2>
            <canvas class="plot" id="sense"></canvas>
          </section>
          <section class="panel syn" id="syn">
            <h2>Sinapsa</h2>
          </section>
          <section class="panel" data-sheet="pozicije">
            <h2>Pozicije</h2>
            <div id="posCards" style="flex:1;overflow:hidden"></div>
            <canvas class="thin" id="matrix"></canvas>
          </section>
        </div>
        <div class="pipe" id="pipe"></div>
        <div class="bot">
          <section class="panel" data-sheet="pnl">
            <h2>Roj PnL</h2>
            <div class="pnlhead">
              <div class="huge" id="huge">—</div>
              <div class="statgrid" id="statgrid"></div>
            </div>
            <canvas class="plot" id="eq"></canvas>
            <div id="classBars"></div>
          </section>
          <section class="panel" data-sheet="trak">
            <h2 id="trakTitle">Trak</h2>
            <div class="trakrow">
              <canvas class="plot" id="candles"></canvas>
              <div class="ladder" id="ladder"></div>
            </div>
          </section>
        </div>
        <canvas id="fx"></canvas>
        <div id="actors"></div>
      </div>
    </div>
  </div>
  <div class="back" id="back"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div id="toast"></div>
<script>
(function () {
  "use strict";
  const STATUS_URL = "https://raw.githubusercontent.com/AleeX9311/Kripto-app/sim-data/status.json";
  const AGENTS = [
    { id: "kit", label: "KIT", color: "#ff3df2", about: "Koncentracija nakupov." },
    { id: "trend", label: "TREND", color: "#ffb020", about: "Momentum in promet." },
    { id: "varnost", label: "VARNOST", color: "#ff3b5c", about: "GoPlus, mint, freeze, imetniki. Obvezna odobritev." },
    { id: "bik_medved", label: "BIK/MEDVED", color: "#39ff88", about: "Obrat in pregretje." },
    { id: "izvajanje", label: "IZVAJANJE", color: "#3de0ff", about: "Pot in zdrs." }
  ];
  const RULE = "Potrebni vsaj 4/5 glasovi, VARNOST mora vedno odobriti.";
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let data = null;
  let loading = false;
  let wide = false;
  let running = false;
  let raf = 0;
  let sheetKind = null;
  let focusAgent = null;
  let candles = [];
  let candleKey = "";
  let candleNote = "";
  let hb = {};
  let grown = reduce ? 1 : 0;
  let paths = [];
  let off = null;
  let center = { x: 200, y: 180 };
  let prevSig = null;
  const rng0 = mulberry32(11);

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function num(n) { const v = Number(n); return Number.isFinite(v) ? v : null; }
  function eur(n) {
    const v = num(n);
    return v == null ? "—" : v.toLocaleString("sl-SI", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }
  function money(n) {
    const v = num(n);
    return v == null ? "—" : (v < 0 ? "−" : "") + "$" + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function pct(n) {
    const v = num(n);
    if (v == null) return "—";
    const body = Math.abs(v).toLocaleString("sl-SI", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (v > 0 ? "+" : v < 0 ? "−" : "") + body + " %";
  }
  function trimNum(s) { return String(s).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, ""); }
  function fmtPx(n) {
    const v = num(n);
    if (v == null) return "—";
    const a = Math.abs(v);
    if (a >= 1000) return v.toLocaleString("en-US", { maximumFractionDigits: 2 });
    if (a >= 1) return trimNum(v.toFixed(4));
    if (a >= 0.0001) return trimNum(v.toFixed(6));
    const digits = Math.min(10, Math.ceil(-Math.log10(a)) + 2);
    return trimNum(v.toFixed(digits));
  }
  function chainOf(x) { return x && (x.chain === "solana" || x.chain === "SOL") ? "SOL" : (x && x.chain ? "BSC" : ""); }
  function yesCount(votes) {
    return AGENTS.reduce((n, a) => n + ((votes && votes[a.id] && votes[a.id].vote === "YES") ? 1 : 0), 0);
  }
  function heat(v) {
    const n = num(v);
    if (n == null) return "#1a1e28";
    const t = Math.max(-40, Math.min(40, n)) / 40;
    if (t >= 0) return "rgb(" + (20 + (1 - t) * 20) + "," + (70 + t * 160) + ",70)";
    return "rgb(" + (80 + -t * 150) + ",30,48)";
  }
  function clock() {
    const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Ljubljana", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).formatToParts(new Date());
    const g = (t) => p.find((x) => x.type === t).value;
    $("clock").textContent = g("hour") + ":" + g("minute") + ":" + g("second");
  }
  function ageText() {
    if (!data || !data.last_update) return "—";
    const sec = Math.max(0, Math.round((Date.now() - new Date(data.last_update).getTime()) / 1000));
    if (!Number.isFinite(sec)) return "—";
    return sec < 60 ? sec + " s" : Math.floor(sec / 60) + " min";
  }
  function hotAgent() {
    let best = AGENTS[0].id, bestT = "";
    AGENTS.forEach((a) => {
      const t = ((data && data.agents && data.agents[a.id] && data.agents[a.id].latest) || {}).time || "";
      if (t >= bestT) { bestT = t; best = a.id; }
    });
    return best;
  }
  function fit(canvas) {
    const w = Math.max(2, canvas.clientWidth);
    const h = Math.max(2, canvas.clientHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = Math.floor(w * dpr), H = Math.floor(h * dpr);
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    const g = canvas.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    return { g, w, h };
  }
  function grid(g, w, h) {
    g.strokeStyle = "rgba(255,255,255,.05)";
    g.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      g.beginPath(); g.moveTo(0, (h * i) / 4); g.lineTo(w, (h * i) / 4); g.stroke();
    }
  }
  function render(d) {
    data = d;
    const up = Number(d.pct_vs_eur50) >= 0;
    const realized = (d.closed || []).reduce((s, t) => s + (Number(t.pnl_usd) || 0), 0);
    const fx = num(d.equity_usd) > 0 && num(d.equity_eur) != null ? Number(d.equity_eur) / Number(d.equity_usd) : null;
    const realizedEur = fx != null ? realized * fx : null;
    const wins = Number(d.wins) || 0, losses = Number(d.losses) || 0, n = wins + losses;

      try { hb[p.url] = await fetchOhlcv(p); } catch (_) { hb[p.url] = []; }
    });
    await Promise.all(jobs);
    drawFan();
    drawCandles();
    drawLadder();
    drawPositions();
  }
  function noteTrades() {
    const sig = JSON.stringify({
      o: (data.open || []).map((p) => p.symbol + (p.opened_at || "")),
      c: (data.closed || []).map((t) => t.symbol + (t.closed_at || t.time || ""))
    });
    if (prevSig && prevSig !== sig) {
      const t = $("toast");
      t.textContent = "Nov premik v simulaciji";
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2400);
    }
    prevSig = sig;
  }
  function quad(x1, y1, cx, cy, x2, y2, n) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      pts.push([u * u * x1 + 2 * u * t * cx + t * t * x2, u * u * y1 + 2 * u * t * cy + t * t * y2]);
    }
    return pts;
  }
  function buildSynapse() {
    const fx = $("fx");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(10, fx.clientWidth), h = Math.max(10, fx.clientHeight);
    fx.width = Math.floor(w * dpr);
    fx.height = Math.floor(h * dpr);
    off = document.createElement("canvas");
    off.width = fx.width;
    off.height = fx.height;
    const g = off.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.lineCap = "round";
    g.lineJoin = "round";
    g.globalCompositeOperation = "lighter";
    const rand = mulberry32(29);
    paths = [];
    const colors = ["#39ff88", "#ffd23f", "#ff3df2", "#b44dff", "#3de0ff", "#c8ff4d", "#ff7ad9"];
    let budget = wide ? 2600 : 900;
    function stroke(pts, w0, color, store) {
      g.strokeStyle = color;
      for (let i = 1; i < pts.length; i++) {
        const t = i / pts.length;
        g.globalAlpha = 0.1;
        g.lineWidth = Math.max(0.6, w0 * (2.1 - t));
        g.beginPath();
        g.moveTo(pts[i - 1][0], pts[i - 1][1]);
        g.lineTo(pts[i][0], pts[i][1]);
        g.stroke();
        g.globalAlpha = 0.62 * (1 - t * 0.35);
        g.lineWidth = Math.max(0.3, w0 * (1 - t * 0.78));
        g.stroke();
      }
      g.globalAlpha = 1;
      if (store && paths.length < 48) paths.push({ pts: pts, color: color });
    }
    function wander(x, y, ang, len, width, depth, color) {
      if (budget <= 0 || depth < 0 || len < 8 || width < 0.25) return;
      budget -= 1;
      let px = x, py = y, a = ang;
      const all = [[x, y]];
      const segs = 3;
      const step = len / segs;
      for (let s = 0; s < segs; s++) {
        a += (rand() - 0.5) * 0.85;
        const x2 = px + Math.cos(a) * step;
        const y2 = py + Math.sin(a) * step;
        const nx = Math.cos(a + Math.PI / 2), ny = Math.sin(a + Math.PI / 2);
        const cpx = (px + x2) / 2 + nx * step * (rand() - 0.5);
        const cpy = (py + y2) / 2 + ny * step * (rand() - 0.5);
        const pts = quad(px, py, cpx, cpy, x2, y2, 4);
        for (let k = 1; k < pts.length; k++) all.push(pts[k]);
        px = x2; py = y2;
      }
      stroke(all, width, color, depth >= 2);
      if (depth === 0) return;
      const kids = depth > 3 ? 2 : (rand() < 0.72 ? 2 : 1);
      for (let i = 0; i < kids; i++) {
        wander(px, py, a + (rand() - 0.5) * 1.35, len * (0.52 + rand() * 0.28), width * 0.7, depth - 1, color);
      }
    }
    const cx = center.x, cy = center.y;
    const span = Math.max(w, h);
    for (let i = 0; i < (wide ? 28 : 18); i++) {
      const ang = rand() * Math.PI * 2;
      const rad = wide ? 24 : 14;
      wander(cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad, ang, span * (wide ? 0.05 : 0.07), 0.9, 2, colors[i % colors.length]);
    }
    const roots = wide ? 20 : 14;
    for (let i = 0; i < roots; i++) {
      const ang = (Math.PI * 2 * i) / roots + (rand() - 0.5) * 0.3;
      wander(cx, cy, ang, span * (wide ? 0.22 : 0.22), wide ? 1.7 : 1.35, wide ? 6 : 5, colors[i % colors.length]);
    }
  }
  function sphere(g, x, y, r, bob) {
    g.save();
    g.translate(x, y + bob);
    g.fillStyle = "rgba(0,0,0,.45)";
    g.beginPath();
    g.ellipse(0, r * 0.92, r * 0.72, r * 0.16, 0, 0, 7);
    g.fill();
    const body = g.createRadialGradient(-r * 0.38, -r * 0.42, r * 0.08, r * 0.1, r * 0.1, r * 1.05);
    body.addColorStop(0, "#ffffff");
    body.addColorStop(0.28, "#f7fbff");
    body.addColorStop(0.62, "#d5e0ee");
    body.addColorStop(1, "#7f93ad");
    g.beginPath();
    g.arc(0, 0, r, 0, 7);
    g.fillStyle = body;
    g.fill();
    const spec = g.createRadialGradient(-r * 0.36, -r * 0.42, 0, -r * 0.32, -r * 0.4, r * 0.55);
    spec.addColorStop(0, "rgba(255,255,255,.95)");
    spec.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = spec;
    g.beginPath();
    g.arc(0, 0, r, 0, 7);
    g.fill();
    g.fillStyle = "#0c0d11";
    g.beginPath();
    g.ellipse(-r * 0.22, r * 0.02, r * 0.085, r * 0.22, 0, 0, 7);
    g.ellipse(r * 0.22, r * 0.02, r * 0.085, r * 0.22, 0, 0, 7);
    g.fill();
    g.restore();
  }
  function ghost(g, x, y, r, color, bob) {
    g.save();
    g.translate(x, y + bob);
    g.beginPath();
    g.moveTo(0, -r * 1.2);
    g.bezierCurveTo(r, -r * 0.45, r * 0.95, r * 0.45, r * 0.28, r * 0.95);
    g.quadraticCurveTo(0, r * 0.45, 0, r * 1.05);
    g.quadraticCurveTo(0, r * 0.45, -r * 0.28, r * 0.95);
    g.bezierCurveTo(-r * 0.95, r * 0.45, -r, -r * 0.45, 0, -r * 1.2);
    g.closePath();
    const grd = g.createRadialGradient(-r * 0.25, -r * 0.35, r * 0.1, 0, 0, r * 1.2);
    grd.addColorStop(0, "#fff");
    grd.addColorStop(0.35, color);
    grd.addColorStop(1, color);
    g.fillStyle = grd;
    g.shadowColor = color;
    g.shadowBlur = wide ? 16 : 10;
    g.fill();
    g.shadowBlur = 0;
    g.fillStyle = "#fff";
    [[-0.22, -0.05, -0.55], [0.22, -0.05, 0.55]].forEach((e) => {
      g.save();
      g.translate(r * e[0], r * e[1]);
      g.rotate(e[2]);
      g.beginPath();
      g.ellipse(0, 0, r * 0.07, r * 0.16, 0, 0, 7);
      g.fill();
      g.restore();
    });
    g.restore();
  }
  function drawSynapse(ts) {
    const fx = $("fx");
    if (!off || !fx.width) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const g = fx.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = fx.clientWidth, h = fx.clientHeight;
    g.clearRect(0, 0, w, h);
    if (grown < 1) grown = Math.min(1, grown + 0.012);
    const reach = Math.hypot(w, h) * (0.25 + 0.8 * grown);
    g.save();
    g.beginPath();
    g.arc(center.x, center.y, reach, 0, 7);
    g.clip();
    g.drawImage(off, 0, 0, w, h);
    g.restore();
    const t = reduce ? 0 : ts / 1000;
    paths.forEach((p, i) => {
      if (!p.pts.length) return;
      const u = (t * 0.35 + i * 0.17) % 1;
      const idx = Math.floor(u * (p.pts.length - 1));
      for (let k = 0; k < 4; k++) {
        const q = p.pts[Math.max(0, idx - k)];
        if (!q) continue;
        g.fillStyle = p.color;
        g.globalAlpha = 0.9 - k * 0.2;
        g.beginPath();
        g.arc(q[0], q[1], (wide ? 2.4 : 1.6) - k * 0.25, 0, 7);
        g.fill();
      }
    });
    g.globalAlpha = 1;
    const bob = reduce ? 0 : Math.sin(t * 1.4) * (wide ? 4 : 2.5);
    const orbit = wide ? 132 : 68;
    const gr = wide ? 18 : 11;
    AGENTS.forEach((a, i) => {
      const ang = [-2.35, -1.05, 0.35, 2.15, 3.45][i];
      ghost(g, center.x + Math.cos(ang) * orbit, center.y + Math.sin(ang) * orbit, gr, a.color, bob * 0.4);
    });
    sphere(g, center.x, center.y, wide ? 54 : 30, bob);
  }
  function drawSensor(ts) {
    const c = $("sense");
    if (!c || !data) return;
    const { g, w, h } = fit(c);
    const t = reduce ? 0 : ts / 1000;
    const agents = data.agents || {};
    AGENTS.forEach((a, i) => {
      const row = agents[a.id] || {};
      const ev = Number(row.evaluated) || 0;
      const ap = Number(row.approved) || 0;
      const amp = (ev ? ap / ev : 0.15) * (w * 0.16);
      const x0 = 8 + ((w - 16) * i) / AGENTS.length;
      g.beginPath();
      for (let y = 16; y < h - 22; y += 2) {
        const x = x0 + Math.sin(y * 0.08 + t * 1.6 + i) * amp;
        y === 16 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      g.strokeStyle = a.color;
      g.globalAlpha = 0.9;
      g.lineWidth = wide ? 2 : 1.2;
      g.stroke();
    });
    g.globalAlpha = 1;
    const cands = (data.candidates || []).slice(0, wide ? 40 : 24);
    const cols = wide ? 10 : 6;
    const bw = (w - 8) / cols;
    const bh = 18 / Math.ceil(cands.length / cols);
    cands.forEach((cnd, i) => {
      g.fillStyle = heat(cnd.change24);
      g.fillRect(4 + (i % cols) * bw, h - 20 + Math.floor(i / cols) * bh, bw - 1, Math.max(2, bh - 1));
    });
  }
  function placeCanvas() {
    const board = $("board");
    const mid = document.querySelector(".mid");
    const syn = $("syn");
    const fx = $("fx");
    const top = Math.max(0, mid.offsetTop - (wide ? 70 : 40));
    const height = mid.offsetHeight + (wide ? 140 : 78);
    fx.style.top = top + "px";
    fx.style.left = "0px";
    fx.style.width = board.clientWidth + "px";
    fx.style.height = height + "px";
    center = {
      x: mid.offsetLeft + syn.offsetLeft + syn.offsetWidth / 2,
      y: mid.offsetTop + syn.offsetTop + syn.offsetHeight / 2 - top
    };
    buildSynapse();
    placeActors();
  }
  function placeActors() {
    const box = $("actors");
    const orbit = wide ? 132 : 68;
    const labels = AGENTS.map((a, i) => {
      const ang = [-2.35, -1.05, 0.35, 2.15, 3.45][i];
      const latest = (data && data.agents && data.agents[a.id] && data.agents[a.id].latest) || {};
      const vote = latest.vote === "YES" ? "DA" : latest.vote === "NO" ? "NE" : "—";
      const fx = $("fx");
      const x = fx.offsetLeft + center.x + Math.cos(ang) * (orbit + (wide ? 78 : 46));
      const y = fx.offsetTop + center.y + Math.sin(ang) * (orbit + (wide ? 36 : 22));
      return `<button type="button" class="chipcard" data-agent="${a.id}" style="left:${x}px;top:${y}px"><b style="color:${a.color}">${a.label}</b><span>${esc(vote)} · ${esc(latest.symbol || "—")}</span></button>`;
    }).join("");
    box.innerHTML = labels;
  }
  function layout() {
    wide = window.innerWidth >= 980;
    const board = $("board");
    board.classList.toggle("wide", wide);
    const bw = wide ? 1440 : 390;
    const bh = wide ? 900 : 844;
    const fitEl = $("fit");
    const availW = fitEl.clientWidth;
    const availH = fitEl.clientHeight;
    const s = Math.min(availW / bw, availH / bh);
    const scaler = $("scaler");
    scaler.style.width = (bw * s) + "px";
    scaler.style.height = (bh * s) + "px";
    board.style.transform = "scale(" + s + ")";
    placeCanvas();
    if (data) {
      drawRotation(); drawStack(); drawFan(); drawCandles(); drawEquity(); drawMatrix(); drawPositions(); drawSensor(performance.now());
    }
  }
  function agentSheet(id) {
    const order = id ? [AGENTS.find((a) => a.id === id)].concat(AGENTS.filter((a) => a.id !== id)).filter(Boolean) : AGENTS;
    const agents = (data && data.agents) || {};
    return `<p><b>${esc(RULE)}</b></p>` + order.map((a) => {
      const row = agents[a.id] || {};
      const latest = row.latest || {};
      const vote = latest.vote === "YES" ? "DA" : latest.vote === "NO" ? "NE" : "ČAKA";
      const ev = Number(row.evaluated) || 0, ap = Number(row.approved) || 0;
      return `<h3 style="color:${a.color}">${a.label}</h3><p>${esc(a.about)}</p><p>${vote} · ${esc(latest.symbol || "")}</p><p>${esc(latest.reason || "Še ni glasu.")}</p><p class="dim">Ocenjeni ${ev} · DA ${ap} · NE ${Number(row.vetoed) || 0}${ev ? " · " + Math.round(100 * ap / ev) + " %" : ""}</p>`;
    }).join("");
  }
  function left4h(iso) {
    const t = new Date(iso || "").getTime();
    if (!Number.isFinite(t)) return "—";
    const ms = t + 4 * 3600 * 1000 - Date.now();
    if (ms <= 0) return "časovni izhod";
    const m = Math.floor(ms / 60000);
    return Math.floor(m / 60) + " h " + (m % 60) + " min";
  }
  function bookSheet() {
    const open = (data && data.open) || [];
    const body = open.length ? open.map((p) => {
      const pnl = Number(p.pnl_pct) || 0;
      const mark = Math.max(0, Math.min(100, ((pnl + 8) / 28) * 100));
      return `<p><b>${esc(p.symbol)}</b> ${esc(chainOf(p))} <b class="${pnl >= 0 ? "up" : "dn"}">${esc(money(p.pnl_usd))} · ${esc(pct(pnl))}</b></p><div class="level"><i style="left:${mark}%"></i></div><p class="dim">Vstop ${esc(p.entry_price)} · zdaj ${esc(p.last_price)} · do 4h: ${esc(left4h(p.opened_at))}</p>`;
    }).join("") : `<p>NI ODPRTIH POZICIJ</p>`;
    const closed = ((data && data.closed) || []).slice(0, 12).map((t) => `<p class="${Number(t.pnl_usd) >= 0 ? "up" : "dn"}">${esc(t.symbol)} ${esc(money(t.pnl_usd))} <span class="dim">${esc(t.reason || "")}</span></p>`).join("");
    return `<h3>Knjiga</h3>${body}<h3>Zaprto</h3>${closed || "<p>ČAKA</p>"}<h3>Pravila</h3><p><b>SIMULACIJA · VIRTUALNI DENAR.</b> ${esc(RULE)}</p><p>10 % na pozicijo, največ 5 odprtih. Izstop −8 %, +20 %, trailing 10 % po +10 %, časovni izhod 4 h. Zdrs 1 % (2 % na majhnem SOL bazenu). 9. 11. 2026 – 16. 11. 2026.</p>`;
  }
  function paintSheet() {
    let html = "";
    if (sheetKind === "agents" || sheetKind === "senzor") html = agentSheet(focusAgent);
    else if (sheetKind === "knjiga" || sheetKind === "pozicije" || sheetKind === "pnl") html = bookSheet();
    else if (sheetKind === "signal") {
      html = `<h3>Signal rotacija</h3><p class="dim">X je 5-minutni momentum iz glasu TREND. Y je število glasov DA. Krivulja je povezava, ne zgodovina cene.</p>` + ((data && data.candidates) || []).slice(0, 16).map((c) => `<p>${esc(c.symbol)} ${esc(chainOf(c))} ${esc(c.category || "")} ${yesCount(c.votes)}/5 ${c.change24 == null ? "—" : esc(pct(c.change24))}</p>`).join("");
    } else if (sheetKind === "sled" || sheetKind === "trak") {
      html = `<h3>Sled</h3><p>${esc(RULE)}</p>` + sledRows().map((r) => `<p class="${r.ok ? "up" : "dn"}">${esc((r.ev.time || "").slice(11, 16))} ${esc(r.ev.symbol || "")} ${esc(r.votes)} ${esc(r.ev.text || "")}</p>`).join("");
    } else if (sheetKind === "cenilec") {
      html = `<h3>Cenilec</h3><p>Pahljača je statistični stožec iz standardnega odklona zadnjih 15-minutnih donosov GeckoTerminal. <b>Ni napoved cene.</b></p><p class="dim">${esc(candleNote || "")}</p>`;
    }
    $("sheet").innerHTML = `<button type="button" class="chip" data-close="1">Zapri</button>` + html;
    $("sheet").classList.add("show");
    $("back").classList.add("show");
  }
  function closeSheet() {
    sheetKind = null;
    $("sheet").classList.remove("show");
    $("back").classList.remove("show");
  }
  function frame(ts) {
    if (!running) return;
    drawSynapse(ts);
    drawSensor(ts);
    raf = requestAnimationFrame(frame);
  }
  function start() {
    if (reduce) { drawSynapse(0); drawSensor(0); return; }
    if (running) return;
    running = true;
    raf = requestAnimationFrame(frame);
  }
  function stop() { running = false; if (raf) cancelAnimationFrame(raf); }
  async function load() {
    if (loading) return;
    loading = true;
    try {
      const res = await fetch(STATUS_URL + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(String(res.status));
      const json = await res.json();
      if (!json || json.note !== "SIMULACIJA") throw new Error("posnetek");
      render(json);
    } catch (_) {
      if (!data) $("tick").textContent = "POSNETKA ŠE NI · SAMO SIMULACIJA";
    } finally { loading = false; }
  }
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-close]") || e.target.id === "back") { closeSheet(); return; }
    const agent = e.target.closest("[data-agent]");
    if (agent) { sheetKind = "agents"; focusAgent = agent.dataset.agent; paintSheet(); return; }
    const panel = e.target.closest("[data-sheet]");
    if (panel) { sheetKind = panel.dataset.sheet; focusAgent = null; paintSheet(); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
  window.addEventListener("resize", layout);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") stop();
    else { start(); load(); }
  });
  clock();
  setInterval(clock, 1000);
  setInterval(() => { if (document.visibilityState === "visible") { const tick = $("tick"); if (data && tick) { /* age refreshes with full render */ } load(); } }, 20000);
  layout();
  start();
  load();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
})();
</script>
