<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<title>Sklad</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --ink: #f4f6fb;
    --muted: #9aa3b8;
    --teal: #3ee0c5;
    --violet: #a78bfa;
    --gold: #e8c27a;
    --rose: #ff6b8a;
    --line: rgba(255,255,255,.12);
    --glass: rgba(14, 16, 32, .62);
    --safe-b: env(safe-area-inset-bottom);
    --safe-t: env(safe-area-inset-top);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #07060f; color: var(--ink); }
  body {
    min-height: 100dvh;
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
    background:
      radial-gradient(420px 280px at -10% 18%, rgba(124, 77, 255, .45), transparent 70%),
      radial-gradient(380px 320px at 110% 8%, rgba(20, 184, 166, .38), transparent 68%),
      #07060f;
  }
  header, main, nav { position: relative; z-index: 1; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(8px + var(--safe-t)) 18px 0;
  }
  .brand { letter-spacing: .22em; font-size: 12px; font-weight: 650; }
  .paper {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid rgba(232,194,122,.75); color: var(--gold);
    border-radius: 999px; padding: 6px 12px; letter-spacing: .16em; font-size: 11px;
    background: rgba(232,194,122,.08);
    box-shadow: 0 0 18px rgba(232,194,122,.18);
  }
  .paper i { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  main { flex: 1; min-height: 0; overflow: auto; padding: 6px 14px 10px; }
  .page { display: none; }
  .page.on { display: block; }
  .balance { text-align: center; padding: 8px 0 0; }
  .balance b {
    display: block; font-weight: 260; font-size: 52px; letter-spacing: -.04em; line-height: .95;
    background: linear-gradient(100deg, #ffffff 0%, #ddd0ff 42%, #8ef0e4 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin-top: 4px; font-size: 13px; color: var(--muted); }
  .sub .up { color: var(--teal); }
  .sub .down { color: var(--rose); }
  .stage { position: relative; height: 268px; margin: 4px 0 2px; perspective: 900px; }
  #streams { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; opacity: .25; }
  .stage.streams-on #streams { opacity: 1; }
  .disc {
    position: absolute; left: 2%; right: 2%; bottom: 36px; height: 118px; border-radius: 50%; z-index: 0;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(150, 110, 255, .55), rgba(40, 120, 170, .22) 46%, rgba(8, 10, 20, .05) 70%);
    border: 2px solid rgba(190, 235, 255, .72);
    box-shadow: 0 0 36px rgba(110, 190, 255, .55), inset 0 0 28px rgba(180, 90, 255, .45), 0 18px 30px rgba(0,0,0,.35);
    transform: rotateX(64deg);
  }
  .disc::after {
    content: ""; position: absolute; inset: 18% 16%; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.28);
  }
  .orb {
    position: absolute; width: 86px; border: 0; background: none; padding: 0; z-index: 3;
    display: grid; justify-items: center; gap: 2px;
  }
  .orb img { width: 100%; height: auto; display: block; pointer-events: none; }
  .olabel { font-size: 10px; letter-spacing: .04em; color: #d5dbed; text-shadow: 0 1px 4px #000; }
  .o-mgr { width: 92px; left: 6%; top: 8px; }
  .o-res { width: 88px; right: 6%; top: 4px; }
  .o-risk { width: 84px; left: 18%; bottom: 2px; }
  .o-exe { width: 84px; right: 16%; bottom: 0; }
  .stage .o-mgr { animation: orbit 8s ease-in-out infinite; opacity: .72; }
  .stage.has-champion .o-mgr { opacity: 1; filter: drop-shadow(0 0 14px rgba(255, 196, 80, .85)); }
  @keyframes orbit { 50% { transform: translate(7px, -8px); } }
  .stage.fetching .o-res { animation: scan 3s ease-in-out infinite; }
  .stage.fetching .o-res img { animation: ring 2.2s linear infinite; }
  @keyframes scan { 50% { transform: translateX(12px); } }
  @keyframes ring { to { filter: drop-shadow(0 0 10px rgba(80, 240, 255, .95)) hue-rotate(25deg); } }
  .stage:not(.fetching) .o-res { opacity: .5; }
  .o-risk { animation: calm 3.6s ease-in-out infinite; }
  @keyframes calm { 50% { transform: scale(1.05); } }
  .stage.risk-hot .o-risk { animation: tighten 1s ease-in-out infinite; filter: drop-shadow(0 0 12px #ff3355); }
  @keyframes tighten { 50% { transform: scale(.88); } }
  .stage.exec-idle .o-exe { opacity: .34; filter: saturate(.4); animation: none; }
  .stage.exec-work .o-exe { animation: flash 1.3s ease-in-out infinite; }
  @keyframes flash { 40% { filter: brightness(1.55) drop-shadow(0 0 14px #ffb020); transform: translateY(-4px); } }
  .speech {
    margin: 0 6px 8px; padding: 12px 16px 12px 14px; border-radius: 18px;
    background: rgba(18, 20, 38, .55); border: 1px solid var(--line);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 10px 24px rgba(0,0,0,.2);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    position: relative; min-height: 58px;
  }
  .speech p { margin: 0; font-size: 13.5px; }
  .spark { position: absolute; right: 10px; bottom: 8px; width: 14px; height: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card {
    background: var(--glass); border: 1px solid var(--line); border-radius: 18px;
    padding: 10px 10px 8px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
    min-height: 0;
  }
  .card h2 { margin: 0; font-size: 10px; letter-spacing: .14em; color: #c9d0e2; font-weight: 650; }
  #gauge { display: block; width: 100%; height: 54px; margin: 6px 0 0; }
  .gauge-num { display: block; margin-top: 4px; font-size: 26px; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
  .band { color: var(--teal); font-size: 12px; letter-spacing: .12em; }
  .kill-top { display: flex; justify-content: space-between; align-items: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 8px var(--rose); display: inline-block; }
  .dial { width: 86px; height: 86px; margin: 4px auto 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #2a2418, #121018 70%);
    border: 2px solid rgba(232,194,122,.7);
    box-shadow: 0 0 16px rgba(232,194,122,.25), inset 0 0 12px rgba(0,0,0,.5);
    display: grid; place-items: center; position: relative;
  }
  .switch { width: 54px; height: 30px; border-radius: 999px; border: 0; padding: 3px; background: #3a3f52; }
  .switch i { display: block; width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(#fff,#d7dbe8); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .switch.on { background: linear-gradient(90deg,#ff6d8a,#ffb25e); }
  .switch.on i { transform: translateX(24px); }
  .power { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 16px; height: 16px; }
  .tiny { color: var(--muted); font-size: 11px; text-align: center; }
  .chart { width: 100%; height: 92px; display: block; }
  #board { max-height: 128px; overflow: auto; }
  .lb-row { display: flex; justify-content: space-between; gap: 6px; padding: 3px 0; font-size: 12px; }
  .lb-row b.neg { color: var(--rose); font-weight: 600; }
  .lb-row b.pos { color: var(--teal); font-weight: 600; }
  .lb-row b.na { color: var(--muted); font-weight: 500; }
  .live { color: var(--gold); letter-spacing: .12em; font-size: 10px; }
  nav {
    margin: 0 10px calc(8px + var(--safe-b)); flex: none;
    display: flex; justify-content: space-around; padding: 8px 4px 6px; border-radius: 24px;
    background: rgba(12, 14, 28, .78); border: 1px solid var(--line);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  nav button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 9px; display: grid; justify-items: center; gap: 2px; }
  nav button.on { color: #c4b5fd; }
  nav button.on svg { filter: drop-shadow(0 0 6px rgba(167,139,250,.9)); }
  nav svg { width: 22px; height: 22px; }
  .stack { display: grid; gap: 8px; }
  .stack .card p, .stack .card .row { margin: 6px 0; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-top: 1px solid rgba(255,255,255,.06); }
  .row span { color: var(--muted); }
  .toast { position: fixed; left: 20px; right: 20px; bottom: calc(86px + var(--safe-b)); z-index: 5; text-align: center; padding: 10px 12px; border-radius: 14px; background: rgba(16,18,32,.9); border: 1px solid var(--line); opacity: 0; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .o-mgr, .o-res, .o-risk, .o-exe, .o-res img, .stage.fetching .o-res, .stage.risk-hot .o-risk, .stage.exec-work .o-exe { animation: none; }
    .switch i { transition: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">SKLAD</div>
  <div class="paper"><i></i>PAPER</div>
</header>
<main id="scroller">
  <section class="page on" data-page="tla">
    <div class="balance">
      <b id="equity">—</b>
      <div class="sub" id="eqsub">čakam na knjigo</div>
    </div>
    <div class="stage" id="stage">
      <canvas id="streams"></canvas>
      <div class="disc"></div>
      <button class="orb o-mgr" type="button" data-agent="uprava"><img src="orbs/manager.webp" alt="Uprava"><span class="olabel" id="lab-mgr">—</span></button>
      <button class="orb o-res" type="button" data-agent="raziskava"><img src="orbs/research.webp" alt="Raziskava"><span class="olabel" id="lab-res">—</span></button>
      <button class="orb o-risk" type="button" data-agent="tveganje"><img src="orbs/risk.webp" alt="Tveganje"><span class="olabel" id="lab-risk">—</span></button>
      <button class="orb o-exe" type="button" data-agent="izvrsitev"><img src="orbs/execution.webp" alt="Izvršitev"><span class="olabel" id="lab-exe">—</span></button>
    </div>
    <div class="speech">
      <p id="speech">…</p>
      <svg class="spark" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0l1.6 5.2L15 8l-5.4 1.6L8 16l-1.6-6.4L1 8l5.4-2.8z" fill="#d8c7ff"/></svg>
    </div>
    <div class="grid2">
      <article class="card">
        <h2>TVEGANJE</h2>
        <svg id="gauge" viewBox="0 0 140 70">
          <path d="M16 68 A 52 52 0 0 1 124 68" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10" stroke-linecap="round"/>
          <path id="garc" d="M16 68 A 52 52 0 0 1 124 68" fill="none" stroke="url(#gg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="163"/>
          <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3ee0c5"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
        </svg>
        <div class="gauge-num" id="gnum">—</div>
        <div class="band" id="gband">—</div>
        <div class="tiny" id="gnote"></div>
      </article>
      <article class="card">
        <div class="kill-top"><h2>IZKLOP</h2><span id="killflag"><i class="dot"></i></span></div>
        <div class="dial">
          <button class="switch" id="killsw" type="button" aria-pressed="false"><i></i></button>
          <svg class="power" id="power" viewBox="0 0 16 16"><path d="M8 2v5M4.2 4.2a5 5 0 1 0 7.6 0" fill="none" stroke="#ff5a6a" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <div class="tiny" id="kill1">—</div>
        <div class="tiny" id="kill2"></div>
      </article>
    </div>
    <div class="grid2" style="margin-top:8px">
      <article class="card">
        <h2>PORTFELJ</h2>
        <canvas class="chart" id="chart"></canvas>
      </article>
      <article class="card">
        <div class="kill-top"><h2>STRATEGIJE</h2><span class="live" id="livedot">TEST</span></div>
        <div id="board"></div>
      </article>
    </div>
  </section>
  <section class="page" data-page="knjiga"><div class="stack" id="book"></div></section>
  <section class="page" data-page="arena"><div class="stack" id="lab"></div></section>
  <section class="page" data-page="dnevnik"><div class="stack" id="reports"></div></section>
  <section class="page" data-page="pravila"><div class="stack" id="rules"></div></section>
</main>
<nav>
  <button class="on" data-tab="tla" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>Nadzor</button>
  <button data-tab="knjiga" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg>Portfelj</button>
  <button data-tab="arena" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 3h6l1 7H8l1-7zM8 10c0 4 8 4 8 0"/><path d="M10 18h4"/></svg>Laboratorij</button>
  <button data-tab="dnevnik" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M9 13h6M9 17h4"/></svg>Poročila</button>
  <button data-tab="pravila" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Pravila</button>
</nav>
<div class="toast" id="toast"></div>
<script>
const money = new Intl.NumberFormat("sl-SI", { style: "currency", currency: "EUR" });
const pct = new Intl.NumberFormat("sl-SI", { style: "percent", maximumFractionDigits: 1 });
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const NAMES = {
  trend: "Sledenje", mean_reversion: "Vrnitev", vol_breakout: "Preboj", relative_value: "Relativno",
  xsection: "Prečni", funding: "Funding", regime_trend: "Režim", donchian: "Donchian",
  dominance: "BTC proti altom", vol_target: "Vol cilj", session: "Seja"
};
let agents = [];
let shown = null;

document.querySelectorAll("nav button").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("on"));
  document.querySelectorAll(".page").forEach(p => p.classList.remove("on"));
  btn.classList.add("on");
  document.querySelector(`[data-page="${btn.dataset.tab}"]`).classList.add("on");
}));
document.getElementById("killsw").addEventListener("click", () => {
  const toast = document.getElementById("toast");
  toast.textContent = "Izklop drži pravilo. Sam ga ne ugašam.";
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1600);
});
document.querySelectorAll(".orb").forEach(btn => btn.addEventListener("click", () => {
  const hit = agents.find(a => a.id === btn.dataset.agent);
  if (hit) document.getElementById("speech").textContent = hit.tldr;
}));

const streams = document.getElementById("streams");
const sctx = streams.getContext("2d");
function fit() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  streams.width = streams.clientWidth * dpr;
  streams.height = streams.clientHeight * dpr;
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", fit);
fit();
const bits = Array.from({ length: 18 }, (_, i) => ({ t: Math.random(), lane: i % 3, s: 0.004 + (i % 4) * 0.0015 }));
let frame = 0;
function drawStreams() {
  const w = streams.clientWidth, h = streams.clientHeight;
  sctx.clearRect(0, 0, w, h);
  const lanes = [
    [w * .28, h * .42, w * .55, h * .22, w * .78, h * .4],
    [w * .3, h * .72, w * .5, h * .5, w * .74, h * .7],
    [w * .22, h * .55, w * .5, h * .62, w * .8, h * .5]
  ];
  lanes.forEach((p, i) => {
    sctx.strokeStyle = i === 1 ? "rgba(62,224,197,.35)" : "rgba(167,139,250,.4)";
    sctx.lineWidth = 1.2;
    sctx.beginPath();
    sctx.moveTo(p[0], p[1]);
    sctx.quadraticCurveTo(p[2], p[3], p[4], p[5]);
    sctx.stroke();
  });
  const flowing = document.getElementById("stage").classList.contains("streams-on");
  if (!flowing && !reduced) { requestAnimationFrame(drawStreams); return; }
  bits.forEach(bit => {
    if (!reduced && flowing) bit.t = (bit.t + bit.s) % 1;
    const p = lanes[bit.lane];
    const t = bit.t, u = 1 - t;
    const x = u * u * p[0] + 2 * u * t * p[2] + t * t * p[4];
    const y = u * u * p[1] + 2 * u * t * p[3] + t * t * p[5];
    sctx.fillStyle = bit.lane === 1 ? "#7ef0e2" : "#c4b5fd";
    sctx.beginPath();
    sctx.arc(x, y, 1.7, 0, 7);
    sctx.fill();
  });
  if (!reduced) requestAnimationFrame(drawStreams);
}
drawStreams();

function countTo(value) {
  const el = document.getElementById("equity");
  if (reduced || shown == null) { el.textContent = money.format(value); shown = value; return; }
  const from = shown, start = performance.now();
  const step = (now) => {
    const k = Math.min(1, (now - start) / 700);
    el.textContent = money.format(from + (value - from) * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  shown = value;
}

function drawChart(hist) {
  const cnv = document.getElementById("chart");
  const c = cnv.getContext("2d");
  const dpr = Math.min(2, devicePixelRatio || 1);
  cnv.width = cnv.clientWidth * dpr;
  cnv.height = cnv.clientHeight * dpr;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = cnv.clientWidth, h = cnv.clientHeight;
  c.clearRect(0, 0, w, h);
  c.strokeStyle = "rgba(255,255,255,.06)";
  for (let i = 1; i < 4; i++) {
    c.beginPath(); c.moveTo(0, h * i / 4); c.lineTo(w, h * i / 4); c.stroke();
  }
  if (!hist.length) return;
  const vals = hist.map(p => p.equity);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (max - min < 1) { min -= 5; max += 5; }
  const pts = vals.map((v, i) => [(i / Math.max(1, vals.length - 1)) * (w - 8) + 4, 6 + (1 - (v - min) / (max - min)) * (h - 14)]);
  c.beginPath();
  pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]));
  c.strokeStyle = "#3ee0c5"; c.lineWidth = 2; c.stroke();
  c.lineTo(pts.at(-1)[0], h); c.lineTo(pts[0][0], h);
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "rgba(62,224,197,.35)"); g.addColorStop(1, "rgba(62,224,197,0)");
  c.fillStyle = g; c.fill();
}

function card(title, body) {
  const el = document.createElement("article");
  el.className = "card";
  const h = document.createElement("h2");
  h.textContent = title;
  const p = document.createElement("div");
  p.textContent = body;
  el.append(h, p);
  return el;
}

function render(data) {
  agents = data.agents || [];
  const stage = document.getElementById("stage");
  const age = data.updated ? Date.now() - new Date(data.updated).getTime() : 1e12;
  const fetching = (age < 12 * 60 * 1000 && data.heartbeat && data.heartbeat.ok) || data.phase === "nočna raziskava";
  const hot = !!(data.kill || data.daily_brake || data.event_window || /veto|okno|izklop|zavora/.test(data.entries_blocked || ""));
  const working = (data.positions || []).length > 0;
  stage.classList.toggle("fetching", fetching);
  stage.classList.toggle("risk-hot", hot);
  stage.classList.toggle("exec-idle", !!data.entries_blocked && !working);
  stage.classList.toggle("exec-work", working);
  stage.classList.toggle("has-champion", !!(data.champion && data.champion.id));
  stage.classList.toggle("streams-on", !!(data.heartbeat && data.heartbeat.ok));
  document.getElementById("lab-mgr").textContent = data.champion && data.champion.id ? (NAMES[data.champion.id] || data.champion.id) : "ni prvaka";
  document.getElementById("lab-res").textContent = fetching ? "bere vire" : "čaka";
  document.getElementById("lab-risk").textContent = data.kill ? "izklop" : data.event_window ? "okno" : data.daily_brake ? "zavora" : "mirno";
  document.getElementById("lab-exe").textContent = working ? "v poslu" : data.entries_blocked ? "stoji" : "pripravljen";
  countTo(data.equity_eur);
  const pnl = data.pnl_eur || 0;
  let when = "";
  if (data.updated) {
    when = new Date(data.updated).toLocaleString("sl-SI", { timeZone: "Europe/Ljubljana", hour: "2-digit", minute: "2-digit" });
  }
  document.getElementById("eqsub").innerHTML = `<span class="${pnl >= 0 ? "up" : "down"}">${pnl >= 0 ? "+" : ""}${money.format(pnl)}</span> · ${when} · ${data.phase || ""}`;
  const boss = agents.find(a => a.id === "uprava") || agents[0];
  document.getElementById("speech").textContent = boss ? boss.tldr : "Ni sporočila.";

  const dd = Math.abs(data.drawdown_from_peak || 0);
  const used = Math.min(1, dd / 0.15);
  const arc = document.getElementById("garc");
  arc.style.strokeDashoffset = String(163 * (1 - used));
  arc.style.opacity = used < 0.02 ? "0" : "1";
  document.getElementById("gnum").textContent = pct.format(dd);
  document.getElementById("gband").textContent = used < 0.33 ? "NIZKO" : used < 0.66 ? "SREDNJE" : "VISOKO";
  document.getElementById("gnote").textContent = dd === 0 ? "ni padca od vrha" : "padec od vrha";

  const on = !!data.kill;
  document.getElementById("killsw").classList.toggle("on", on);
  document.getElementById("killsw").setAttribute("aria-pressed", on ? "true" : "false");
  document.getElementById("killflag").innerHTML = on ? '<i class="dot"></i> AKTIVIRAN' : '<i class="dot" style="opacity:.35"></i> MIRUJE';
  document.getElementById("power").style.opacity = on ? "1" : ".45";
  document.getElementById("kill1").textContent = on ? "izklop drži" : "izklop miruje";
  document.getElementById("kill2").textContent = data.entries_blocked || "vstopi so odprti";
  drawChart(data.equity_history || []);

  const tested = {};
  ((data.research || {}).summary || []).forEach(row => { tested[row.id] = row; });
  const order = Object.keys(NAMES).sort((a, b) => {
    const ra = tested[a] ? tested[a].oos_return : -999;
    const rb = tested[b] ? tested[b].oos_return : -999;
    return rb - ra;
  });
  const board = document.getElementById("board");
  board.replaceChildren();
  order.forEach((id, index) => {
    const line = document.createElement("div");
    line.className = "lb-row";
    const left = document.createElement("span");
    left.textContent = (index === 0 ? "♛ " : (index + 1) + " ") + NAMES[id];
    const right = document.createElement("b");
    const row = tested[id];
    if (!row || row.oos_return == null) { right.className = "na"; right.textContent = "ni testa"; }
    else { right.className = row.oos_return >= 0 ? "pos" : "neg"; right.textContent = pct.format(row.oos_return); }
    line.append(left, right);
    board.appendChild(line);
  });
  document.getElementById("livedot").textContent = data.heartbeat && data.heartbeat.ok ? "SVEŽE" : "TEST";

  const book = document.getElementById("book");
  book.replaceChildren();
  const pos = (data.positions || []).map(p => p.market + " · " + money.format(p.size_eur)).join("\n");
  book.append(card("POZICIJE", pos || "Ni odprtih poslov."));
  book.append(card("ODPRTO TVEGANJE", money.format(data.open_risk_eur || 0)));

  const lab = document.getElementById("lab");
  lab.replaceChildren();
  (data.cards || []).forEach(item => {
    const row = tested[item.id];
    const extra = row ? ` Test ${pct.format(row.oos_return)} · ${row.oos_trades} poslov · ${row.pass ? "prestal" : "ni prestal"}.` : " Ni testa.";
    lab.append(card(item.name, item.text + extra));
  });

  const reports = document.getElementById("reports");
  reports.replaceChildren();
  const rep = data.report || {};
  reports.append(card("DNEVNO", rep.date ? `${rep.date} · ${money.format(rep.pnl_eur || 0)} · ${rep.lesson || ""}` : "Še ni poročila."));
  const closed = (data.closed || []).slice(0, 6).map(t => `${t.market} ${t.r_multiple ?? "—"} R`).join("\n");
  reports.append(card("DNEVNIK", closed || "Dnevnik je prazen."));

  const rules = document.getElementById("rules");
  rules.replaceChildren();
  rules.append(card("PRAVILA", (data.golden || []).join("\n")));
  rules.append(card("7 DNI", (data.kickoff || []).map(k => `Dan ${k.day}: ${k.done ? "narejeno" : "odprto"} · ${k.item}`).join("\n")));
}

async function load() {
  const urls = ["status.json", "https://raw.githubusercontent.com/AleeX9311/Kripto-app/fund-data/status.json", "https://raw.githubusercontent.com/AleeX9311/kripto-app/fund-data/status.json"];
  for (const url of urls) {
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) continue;
      const data = await res.json();
      if (data && data.note === "PAPER" && typeof data.equity_eur === "number") { render(data); return; }
    } catch (err) {}
  }
}
load();
setInterval(load, 60000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
