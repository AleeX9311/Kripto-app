name: Solana paper desk

on:
  schedule:
    # Backup only. GitHub often starts this late; the long job re-dispatches itself.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/kick/soldesk"

permissions:
  contents: write
  actions: write

concurrency:
  # Separate from sim-data so the two paper books can publish at the same time.
  group: sol-desk-data
  cancel-in-progress: false

jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - name: Install dependencies
        run: python3 -m pip install --quiet -r soldesk/engine/requirements.txt

      - name: Load book from sol-desk-data
        run: |
          set -euo pipefail
          mkdir -p soldesk/engine/logs
          if git fetch --depth=1 origin sol-desk-data; then
            git show FETCH_HEAD:state.json > soldesk/engine/state.json
            for f in decisions.jsonl trades.csv equity.csv; do
              git cat-file -e "FETCH_HEAD:$f" 2>/dev/null && git show "FETCH_HEAD:$f" > "soldesk/engine/logs/$f" || true
            done
            echo "Loaded sol-desk-data"
          else
            echo "sol-desk-data is missing — the desk will open a new $1000 paper book"
          fi

      - name: Paper passes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish() {
            test -f soldesk/engine/state.json
            test -f soldesk/engine/status.json
            WT="${RUNNER_TEMP}/sol-desk-wt"
            if [ ! -e "$WT/.git" ]; then
              rm -rf "$WT"
              if git fetch --depth=1 origin sol-desk-data; then
                git worktree add -B sol-desk-data "$WT" FETCH_HEAD
              else
                git worktree add --detach "$WT" HEAD
                git -C "$WT" switch --orphan sol-desk-data
                git -C "$WT" rm -rf --cached . >/dev/null 2>&1 || true
              fi
            fi
            cp soldesk/engine/state.json "$WT/state.json"
            cp soldesk/engine/status.json "$WT/status.json"
            mkdir -p "$WT"
            if [ -f soldesk/engine/logs/decisions.jsonl ]; then
              tail -n 400 soldesk/engine/logs/decisions.jsonl > "$WT/decisions.jsonl"
            fi
            if [ -f soldesk/engine/logs/trades.csv ]; then
              cp soldesk/engine/logs/trades.csv "$WT/trades.csv"
            fi
            if [ -f soldesk/engine/logs/equity.csv ]; then
              cp soldesk/engine/logs/equity.csv "$WT/equity.csv"
            fi
            git -C "$WT" add -- state.json status.json decisions.jsonl trades.csv equity.csv
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                state.json|status.json|decisions.jsonl|trades.csv|equity.csv) ;;
                *) echo "Refusing to publish unexpected file: $f"; exit 1 ;;
              esac
            done < <(git -C "$WT" ls-files)
            if git -C "$WT" diff --cached --quiet; then
              echo "No snapshot changes"
              return 0
            fi
            git -C "$WT" commit -m "Update Solana paper desk snapshot"
            git -C "$WT" push origin HEAD:sol-desk-data
          }

          # A queued cron or a second kick must not start another 6h loop.
          others=$(gh run list --workflow "Solana paper desk" --limit 30 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and (.status==\"in_progress\" or .status==\"queued\" or .status==\"pending\" or .status==\"waiting\" or .status==\"requested\"))] | length" || true)
          if [ "${others:-0}" -gt 0 ]; then
            echo "Another Solana paper desk run is already active or queued (${others}). Leaving it."
            exit 0
          fi

          # One process scans about every 20s for 5h48m. First snapshot is pushed quickly, then every 90s.
          SOLDESK_CLOUD=1 python3 soldesk/engine/main.py --headless --minutes 348 --poll 20 &
          pid=$!
          sleep 25
          publish || echo "publish skipped"
          while kill -0 "$pid" 2>/dev/null; do
            sleep 90
            publish || echo "publish skipped"
          done
          set +e
          wait "$pid"
          code=$?
          set -e
          publish || echo "final publish skipped"
          if [ "$code" -eq 0 ]; then
            gh workflow run "Solana paper desk" --ref main || echo "re-dispatch failed; the */5 cron is the backup"
          fi
          exit "$code"
