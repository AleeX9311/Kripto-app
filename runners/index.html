<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05060c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Runner Desk" />
  <meta name="description" content="Papirni Runner Desk. Virtualni denar, brez denarnice." />
  <title>Runner Desk</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" href="icon-192.png" />
  <style>
    :root {
      --bg:#05060c; --ink:#eef4ff; --muted:#93a0bc; --line:rgba(255,255,255,.1);
      --ok:#3dffb0; --warn:#ffc14d; --bad:#ff5d73; --tab:54px;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; background:
      radial-gradient(120% 60% at 10% -10%, rgba(90,70,255,.35), transparent 50%),
      radial-gradient(90% 50% at 110% 0%, rgba(0,210,180,.18), transparent 46%),
      var(--bg); color:var(--ink);
      font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
      min-height:100%; }
    body { padding-bottom:calc(var(--tab) * 2 + env(safe-area-inset-bottom)); }
    header { padding:calc(10px + env(safe-area-inset-top)) 14px 4px; display:flex; justify-content:space-between; align-items:flex-end; }
    h1 { margin:0; font-size:22px; letter-spacing:.08em; }
    .banner { font-size:10px; letter-spacing:.14em; color:var(--ok); border:1px solid rgba(61,255,176,.45); border-radius:99px; padding:4px 8px; }
    .sub { color:var(--muted); font-size:12px; margin:4px 14px 8px; }
    main { padding:0 12px 12px; }
    .view { display:none; }
    .view.on { display:grid; gap:12px; animation:rise .35s ease; }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
    .glass { background:rgba(12,16,28,.55); border:1px solid var(--line); border-radius:22px; padding:12px;
      backdrop-filter:blur(18px); box-shadow:0 16px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08); }
    h2 { margin:0 0 8px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
    .room { position:relative; height:430px; overflow:hidden; }
    #room { position:absolute; inset:0; width:100%; height:100%; }
    .bot { position:absolute; width:92px; text-align:center; transform:translate(-50%,-50%); }
    .bot svg { width:74px; height:88px; display:block; margin:0 auto; filter:drop-shadow(0 8px 16px color-mix(in srgb,var(--c) 45%,transparent)); }
    .bot .chassis { fill:rgba(8,10,18,.85); stroke:var(--c); stroke-width:2; }
    .bot .visor { fill:#070910; stroke:var(--c); }
    .bot .eye { fill:var(--c); }
    .bot .beam { fill:var(--c); opacity:.8; }
    .bot .body { transform-origin:40px 70px; }
    .bot .name { font-size:10px; letter-spacing:.08em; color:var(--c); font-weight:700; }
    .bubble { margin-bottom:4px; min-height:34px; padding:6px 7px; border-radius:12px; background:rgba(6,8,14,.78);
      border:1px solid color-mix(in srgb,var(--c) 50%,transparent); color:#d5def2; font-size:10px; line-height:1.3; text-align:left; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .stat { padding:8px; }
    .stat span { display:block; color:var(--muted); font-size:9px; letter-spacing:.08em; text-transform:uppercase; }
    .stat b { font-size:16px; font-variant-numeric:tabular-nums; }
    .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
    .dim { color:var(--muted); font-size:12px; }
    .row { padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06); }
    table { width:100%; border-collapse:collapse; font-size:11px; }
    th,td { text-align:left; padding:6px 4px; border-bottom:1px solid rgba(255,255,255,.06); vertical-align:top; }
    .scroll { overflow-x:auto; }
    .scroll table { min-width:820px; }
    select { width:100%; background:rgba(8,10,18,.7); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:8px; }
    canvas#chart { width:100%; height:320px; display:block; border-radius:16px; }
    .tabs { position:fixed; left:0; right:0; bottom:0; z-index:6; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(2,1fr);
      height:calc(var(--tab) * 2 + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom);
      background:rgba(6,8,14,.82); backdrop-filter:blur(16px); border-top:1px solid var(--line); }
    .tabs button { background:transparent; border:0; color:var(--muted); font-size:10px; letter-spacing:.06em; }
    .tabs button.on { color:white; }
    @media (prefers-reduced-motion: no-preference) {
      .bot .body { animation:breathe 3.4s ease-in-out infinite; }
      .bot.think .beam { animation:scan 1.2s linear infinite; }
      .bot.win { animation:hop .7s ease; }
      .bot.rug { animation:shake .45s linear; }
    }
    @keyframes breathe { 50% { transform:translateY(-3px) scale(1.03); } }
    @keyframes scan { from { transform:translateX(-8px); opacity:.2; } to { transform:translateX(8px); opacity:1; } }
    @keyframes hop { 40% { transform:translate(-50%,-62%); } }
    @keyframes shake { 25% { transform:translate(calc(-50% - 3px),-50%); } 75% { transform:translate(calc(-50% + 3px),-50%); } }
    @media (prefers-reduced-motion: reduce) {
      .view.on { animation:none; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>RUNNER DESK</h1>
    </div>
    <div class="banner">PAPER · VIRTUALNI DENAR</div>
  </header>
  <p class="sub" id="age">Čakam živi posnetek.</p>
  <main>
    <section class="view on" id="view-desk"></section>
    <section class="view" id="view-run"></section>
    <section class="view" id="view-graf"></section>
    <section class="view" id="view-book"></section>
    <section class="view" id="view-watch"></section>
    <section class="view" id="view-meta"></section>
    <section class="view" id="view-prav"></section>
  </main>
  <nav class="tabs">
    <button type="button" data-tab="desk" class="on">DESK</button>
    <button type="button" data-tab="run">TRG</button>
    <button type="button" data-tab="graf">GRAF</button>
    <button type="button" data-tab="book">KNJIGA</button>
    <button type="button" data-tab="watch">WATCH</button>
    <button type="button" data-tab="meta">META</button>
    <button type="button" data-tab="prav">PRAVILA</button>
  </nav>
  <script>
(function () {
  "use strict";
  const URL = "https://raw.githubusercontent.com/AleeX9311/Kripto-app/runners-data/status.json";
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const BOTS = [
    { id:"ARCH", name:"Architect", role:"Chief of Operations", c:"#7dd3fc", x:50, y:48 },
    { id:"SCOUT", name:"GMGN Scout", role:"Odkritje", c:"#c4b5fd", x:18, y:30 },
    { id:"META", name:"Meta Analyst", role:"Meta", c:"#ffc14d", x:82, y:28 },
    { id:"VIEW", name:"TradingView", role:"Graf", c:"#3dffb0", x:20, y:74 },
    { id:"RES", name:"Research", role:"Raziskava", c:"#ff7a93", x:80, y:74 }
  ];
  const RULES = [
    "Samo ustaljeni tekači: približno 1M+ MC, večmilijonski 24h volumen, že so tekli. Trenches in novi pari se ne pregledujejo.",
    "Vstop samo v izračunani nakupni coni po globokem povratku, ko višji minimum še drži.",
    "Stop je tik pod podporo cone. Če se višji minimum zlomi, je posel neveljaven.",
    "Cilj je postopno proti 3x–5x ali nazaj proti ATH.",
    "Papirna knjiga 1000 USD, 10 % na posel, največ 5 vstopov v ISO tednu.",
    "Ni setupov — to je dobro znak. Nič setupov pomeni nič posla.",
    "Manjkajoče polje je n/a. Likvidnost približno nič ali sveča v nič je rug.",
    "Vsak odgovor agenta je kratek TLDR. Brez denarnice in brez pravega naročila."
  ];
  let data = null;
  let shownEquity = 1000;
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const money = (n) => Number.isFinite(Number(n)) ? "$" + Number(n).toLocaleString("en-US", {maximumFractionDigits:0}) : "n/a";
  const cell = (v) => (v === null || v === undefined || v === "") ? "n/a" : esc(v);
  const pct = (v) => (v === null || v === undefined) ? "n/a" : esc(v) + " %";

  function lastOf(id) {
    const ev = (data && data.events) || [];
    return [...ev].reverse().find((e) => e.agent === id);
  }
  function mood(bot) {
    const ev = lastOf(bot.id);
    const msg = (ev && ev.message) || "";
    if (/PAPER BUY|zmag|cilj/i.test(msg)) return "win";
    if (/rug|likvidnost ~0|zavrn/i.test(msg)) return "rug";
    if (ev && Date.now() - new Date(ev.ts).getTime() < 4 * 60 * 1000) return "think";
    return "";
  }
  function bubble(bot) {
    const ev = lastOf(bot.id);
    const text = ev ? ev.message : "čakam živi krog";
    return text.length > 90 ? text.slice(0, 88) + "…" : text;
  }

  function room() {
    return `<div class="room glass" id="stage">
      <canvas id="room"></canvas>
      ${BOTS.map((b) => `<div class="bot ${mood(b)}" data-agent="${b.id}" style="left:${b.x}%;top:${b.y}%;--c:${b.c}">
        <div class="bubble">${esc(bubble(b))}</div>
        <svg viewBox="0 0 80 96" aria-hidden="true">
          <g class="body">
            <ellipse cx="40" cy="90" rx="18" ry="4" fill="rgba(0,0,0,.45)"/>
            <rect class="chassis" x="16" y="28" width="48" height="52" rx="18"/>
            <rect class="visor" x="24" y="38" width="32" height="16" rx="6"/>
            <circle class="eye" cx="33" cy="46" r="2.2"/>
            <circle class="eye" cx="47" cy="46" r="2.2"/>
            <rect class="beam" x="30" y="44" width="8" height="3" rx="1"/>
            <rect x="30" y="18" width="20" height="12" rx="6" fill="none" stroke="${b.c}"/>
            <circle cx="40" cy="16" r="3" fill="${b.c}"/>
          </g>
        </svg>
        <div class="name">${esc(b.name)}</div>
      </div>`).join("")}
    </div>`;
  }

  function stats() {
    const d = data || {};
    const eq = shownEquity;
    return `<div class="stats">
      <div class="stat glass"><span>Stanje</span><b id="eq">${money(eq)}</b></div>
      <div class="stat glass"><span>Teden</span><b>${d.week_entries || 0}/${d.week_cap || 5}</b></div>
      <div class="stat glass"><span>Gotovina</span><b>${money(d.balance || 1000)}</b></div>
      <div class="stat glass"><span>Setupi</span><b class="${d.setups ? "warn" : "ok"}">${d.setups || 0}</b></div>
    </div>`;
  }

  function desk() {
    const d = data || {};
    document.getElementById("view-desk").innerHTML = room() + stats() +
      `<article class="glass"><p class="${d.setups ? "warn" : "ok"}">${d.setups ? d.setups + " papirnih setupov." : "Ni setupov — to je dobro znak."}</p>
      <p class="dim">${esc(d.gmgn || "GMGN ključ ni nastavljen. Manjkajoča polja so n/a.")}</p></article>`;
  }

  function runners() {
    const rows = (data && data.candidates) || [];
    const body = rows.map((c) => {
      const k = c.risk || {};
      const cols = [esc(c.symbol) + (k.rug ? " · RUG" : ""), cell(k.reused_dev), cell(k.x_created), cell(k.dev_coins_before), cell(k.dev_best || k.dev_best_mcap), cell([k.creator_fee, k.holder_rewards].filter(Boolean).join(" · ")), pct(k.top10_pct), pct(k.insiders_pct), pct(k.dev_holds_pct), pct(k.bundlers_pct), pct(k.entrapment_pct), money(k.liquidity_usd) + " / " + money(k.volume_24h), cell(k.social), cell(k.main_risk)];
      return `<tr><td>${cols.join("</td><td>")}</td></tr>`;
    }).join("");
    document.getElementById("view-run").innerHTML = `<article class="glass"><h2>Tveganje živih tekačev</h2>
      ${rows.length ? `<div class="scroll"><table><thead><tr><th>Token</th><th>reused/recycled dev?</th><th>X created</th><th>dev coins before</th><th>dev's best (ATH)</th><th>creator fee + rewards</th><th>top10</th><th>insiders</th><th>dev holds</th><th>bundlers</th><th>entrapment</th><th>likvidnost / volumen</th><th>social</th><th>main risk</th></tr></thead><tbody>${body}</tbody></table></div>` : `<p class="ok">Ni setupov — to je dobro znak.</p>`}
      <p class="dim">${esc((data && data.meta_tldr) || "")}</p></article>`;
  }

  function yScale(values, h) {
    const min = Math.min(...values), max = Math.max(...values);
    const span = max - min || 1;
    return (p) => 18 + (h - 36) * (1 - (p - min) / span);
  }

  function drawChart(c) {
    const canvas = document.getElementById("chart");
    const note = document.getElementById("chartNote");
    if (!canvas) return;
    const candles = (c && c.candles_1h) || [];
    const w = canvas.clientWidth || 360, h = 320;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
    const g = canvas.getContext("2d");
    g.setTransform(dpr,0,0,dpr,0,0);
    g.clearRect(0,0,w,h);
    if (candles.length < 2) {
      g.fillStyle = "#93a0bc"; g.font = "13px sans-serif";
      g.fillText("Ni živih sveč. Graf se odpre šele za kandidata iz skenerja.", 16, 40);
      note.textContent = "Brez vzorčnih kovancev.";
      return;
    }
    const highs = candles.map((b) => b[1]), lows = candles.map((b) => b[2]), closes = candles.map((b) => b[3]);
    const all = highs.concat(lows);
    const z = (c.chart_1h && c.chart_1h.zones) || {};
    [z.ath, z.invalidation, z.no_entry && z.no_entry.lo, z.no_entry && z.no_entry.hi, z.buy_a && z.buy_a.lo, z.buy_a && z.buy_a.hi, z.buy_a && z.buy_a.stop, z.buy_b && z.buy_b.lo, z.buy_b && z.buy_b.stop].forEach((n) => { if (Number.isFinite(n)) all.push(n); });
    const y = yScale(all, h);
    const bands = [
      z.no_entry && { ...z.no_entry, color:"rgba(255,193,77,.28)", label:"No-entry – počakaj na dip" },
      z.buy_a && { lo:z.buy_a.stop, hi:z.buy_a.hi, color:"rgba(61,255,176,.22)", label:"Buy A / Stop A" },
      z.buy_b && { lo:z.buy_b.stop, hi:z.buy_b.hi, color:"rgba(52,211,153,.18)", label:"Buy B / Stop B" }
    ].filter(Boolean);
    bands.forEach((b) => {
      const y1 = y(b.hi), y2 = y(b.lo);
      g.fillStyle = b.color;
      g.fillRect(8, Math.min(y1,y2), w-16, Math.max(8, Math.abs(y2-y1)));
      g.fillStyle = "#d5def2"; g.font = "11px sans-serif";
      g.fillText(b.label, 12, Math.min(y1,y2) + 12);
    });
    g.strokeStyle = "rgba(255,255,255,.15)";
    closes.forEach((px, i) => {
      const x = 16 + (i / (closes.length - 1)) * (w - 28);
      const high = highs[i], low = lows[i];
      g.beginPath(); g.moveTo(x, y(high)); g.lineTo(x, y(low)); g.stroke();
      g.fillStyle = "#e8eefc";
      g.fillRect(x - 1.5, y(px) - 1.5, 3, 3);
    });
    if (z.ath) { g.strokeStyle = "#ff5d73"; g.setLineDash([4,3]); g.beginPath(); g.moveTo(8, y(z.ath)); g.lineTo(w-8, y(z.ath)); g.stroke(); g.setLineDash([]); g.fillStyle="#ff5d73"; g.fillText("ATH / upor", 12, y(z.ath)-4); }
    if (z.invalidation) { g.strokeStyle = "#c4b5fd"; g.beginPath(); g.moveTo(8, y(z.invalidation)); g.lineTo(w-8, y(z.invalidation)); g.stroke(); g.fillStyle="#c4b5fd"; g.fillText("Invalidacija", w-96, y(z.invalidation)-4); }
    const ch = c.chart_1h || {};
    note.textContent = `${c.symbol} · ${c.chain} · ${c.tldr || ""} R:R ${ch.rr ?? "n/a"}. Višji vrhovi ${ch.higher_highs ? "da" : "ne"}, višji minimumi ${ch.higher_lows ? "da" : "ne"}, preboj ${ch.trendline_break ? "da" : "ne"}.`;
  }

  function graf() {
    const list = (data && data.candidates) || [];
    const opts = list.map((c,i) => `<option value="${i}">${esc(c.symbol)} · ${esc(c.chain)}</option>`).join("");
    document.getElementById("view-graf").innerHTML = `<article class="glass"><h2>Živi graf</h2>
      ${list.length ? `<select id="pick">${opts}</select><canvas id="chart"></canvas><p id="chartNote" class="dim"></p>` : `<p class="ok">Ni živih sveč. Ni setupov — to je dobro znak.</p><p id="chartNote" class="dim"></p>`}
      <p class="dim">Cone pridejo samo iz zadnjega posnetka skenerja. 1h sveče, 4h struktura v opisu.</p></article>`;
    if (!list.length) return;
    const paint = () => drawChart(list[Number(document.getElementById("pick").value)]);
    document.getElementById("pick").addEventListener("change", paint);
    paint();
  }

  function book() {
    const d = data || {};
    const open = d.positions || [];
    const closed = d.closed || [];
    document.getElementById("view-book").innerHTML = `<article class="glass"><h2>Papirna knjiga</h2>
      <div class="stats">
        <div class="stat glass"><span>Stanje</span><b>${money(d.equity || 1000)}</b></div>
        <div class="stat glass"><span>Gotovina</span><b>${money(d.balance || 1000)}</b></div>
        <div class="stat glass"><span>Teden</span><b>${d.week_entries || 0}/5</b></div>
        <div class="stat glass"><span>Odprto</span><b>${(d.positions||[]).length}</b></div>
      </div>
      <p>Začetek $1000 · 10 % na posel · teden ${esc(d.week_id || "—")} · ${d.week_entries || 0} / 5 vstopov.</p>
      <p class="dim">Stop pod cono. Invalidacija, če pade višji minimum. Cilj proti 3x–5x ali ATH. Brez pravega naročila.</p></article>
      <article class="glass"><h2>Odprto</h2>${open.length ? open.map((p)=>`<div class="row"><b>${esc(p.symbol)}</b> ${esc(p.chain)}<div class="dim">vstop ${esc(p.fill)} · zdaj ${esc(p.last)} · stop ${esc(p.stop)}</div></div>`).join("") : `<p class="dim">Ni odprtih papirnih poslov.</p>`}</article>
      <article class="glass"><h2>Zaprto</h2>${closed.length ? closed.map((p)=>`<div class="row"><b class="${Number(p.pnl)>=0?"ok":"bad"}">${esc(p.symbol)} ${money(p.pnl)}</b><div class="dim">${esc(p.reason||"")}</div></div>`).join("") : `<p class="dim">Še ni zaprtih poslov.</p>`}</article>`;
  }

  function watch() {
    const rows = (data && data.watchlist) || [];
    document.getElementById("view-watch").innerHTML = `<article class="glass"><h2>Watchlist</h2><p class="dim">Opozorilo, ko živi graf pokaže preboj trendline ali višji minimum.</p>
      ${rows.length ? rows.map((w)=>`<div class="row"><b>${esc(w.symbol)}</b> ${esc(w.chain)}<div class="dim">${esc(w.note||"")}</div></div>`).join("") : `<p class="ok">Seznam je prazen.</p>`}</article>`;
  }
  function meta() {
    document.getElementById("view-meta").innerHTML = `<article class="glass"><h2>Meta</h2><p>${esc((data && data.meta_tldr) || "Jutranji TLDR še ni. Meta Analyst pokrije zadnjih 48 ur iz živih tekačev in vpraša Scout.")}</p></article>`;
  }
  function prav() {
    document.getElementById("view-prav").innerHTML = `<article class="glass"><h2>Pravila</h2>${RULES.map((r)=>`<div class="row">${esc(r)}</div>`).join("")}</article>`;
  }

  function render() {
    const d = data;
    const age = document.getElementById("age");
    if (d && d.last_update) {
      const sec = Math.max(0, Math.round((Date.now() - new Date(d.last_update).getTime()) / 1000));
      age.textContent = "Živi posnetek pred " + sec + "s · " + (d.empty_ok ? "ni setupov" : (d.setups || 0) + " setupov");
    }
    desk(); runners(); watch(); meta(); prav();
    const on = document.querySelector(".view.on");
    if (on && on.id === "view-graf") graf();
    if (on && on.id === "view-book") book();
  }

  document.querySelector(".tabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tab]");
    if (!b) return;
    document.querySelectorAll(".view").forEach((v) => v.classList.toggle("on", v.id === "view-" + b.dataset.tab));
    document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
    if (b.dataset.tab === "graf") graf();
    if (b.dataset.tab === "book") book();
    if (b.dataset.tab === "desk") desk();
  });

  function botPoint(id) {
    const el = document.querySelector(`.bot[data-agent="${id}"] svg`);
    const stage = document.getElementById("stage");
    if (!el || !stage) return null;
    const a = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
    return { x: a.left + a.width/2 - s.left, y: a.top + a.height/2 - s.top };
  }
  function frame(ts) {
    const canvas = document.getElementById("room");
    const stage = document.getElementById("stage");
    if (!canvas || !stage) { if (!REDUCED) requestAnimationFrame(frame); return; }
    const w = stage.clientWidth, h = stage.clientHeight;
    const dpr = Math.min(devicePixelRatio||1, 2);
    if (canvas.width !== Math.floor(w*dpr)) { canvas.width = Math.floor(w*dpr); canvas.height = Math.floor(h*dpr); }
    const g = canvas.getContext("2d");
    g.setTransform(dpr,0,0,dpr,0,0);
    g.clearRect(0,0,w,h);
    const scout = botPoint("SCOUT") || {x:w*0.18,y:h*0.3};
    g.strokeStyle = "rgba(196,181,253,.35)";
    g.beginPath(); g.arc(scout.x, scout.y, 34, 0, 7); g.stroke();
    if (!REDUCED) {
      const ang = ((ts||0)/1000) % (Math.PI*2);
      g.strokeStyle = "rgba(196,181,253,.8)";
      g.beginPath(); g.moveTo(scout.x, scout.y); g.lineTo(scout.x+Math.cos(ang)*34, scout.y+Math.sin(ang)*34); g.stroke();
    }
    const links = [["META","SCOUT"],["SCOUT","ARCH"],["VIEW","ARCH"],["RES","ARCH"]];
    links.forEach((pair, i) => {
      const a = botPoint(pair[0]), b = botPoint(pair[1]);
      if (!a || !b) return;
      const mx = (a.x+b.x)/2, my = Math.min(a.y,b.y) - 28;
      g.strokeStyle = "rgba(125,211,252,.28)";
      g.beginPath(); g.moveTo(a.x,a.y); g.quadraticCurveTo(mx,my,b.x,b.y); g.stroke();
      if (REDUCED) return;
      const t = ((ts||0)/1400 + i*0.2) % 1;
      const u = 1-t;
      const x = u*u*a.x + 2*u*t*mx + t*t*b.x;
      const y = u*u*a.y + 2*u*t*my + t*t*b.y;
      g.fillStyle = "#7dd3fc"; g.shadowColor="#7dd3fc"; g.shadowBlur=12;
      g.beginPath(); g.arc(x,y,3.2,0,7); g.fill(); g.shadowBlur=0;
    });
    const target = Number((data && data.equity) || 1000);
    shownEquity += (target - shownEquity) * (REDUCED ? 1 : 0.08);
    const eq = document.getElementById("eq");
    if (eq) eq.textContent = money(shownEquity);
    if (!REDUCED) requestAnimationFrame(frame);
  }

  async function load() {
    try {
      const res = await fetch(URL + "?t=" + Date.now(), { cache:"no-store" });
      if (!res.ok) throw new Error(String(res.status));
      const json = await res.json();
      if (!json || json.note !== "PAPER") throw new Error("posnetek");
      data = json;
    } catch (_) {
      if (!data) document.getElementById("age").textContent = "Ni setupov — to je dobro znak. Posnetka še ni.";
    }
    render();
  }
  load();
  setInterval(load, 60000);
  requestAnimationFrame(frame);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
  </script>
</body>
</html>
