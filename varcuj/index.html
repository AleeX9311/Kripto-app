<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061210">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Varčevanje</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --ink: #f3faf6;
    --muted: #9bb3a8;
    --mint: #5ef0c4;
    --deep: #06211c;
    --line: rgba(255,255,255,.12);
    --glass: rgba(8, 28, 24, .62);
    --safe-t: env(safe-area-inset-top);
    --safe-b: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #061210; color: var(--ink); }
  body {
    min-height: 100dvh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    background:
      radial-gradient(420px 260px at -8% 8%, rgba(40, 180, 140, .38), transparent 70%),
      radial-gradient(380px 280px at 110% 0%, rgba(80, 200, 170, .22), transparent 68%),
      #061210;
  }
  header, main, nav { position: relative; z-index: 1; }
  header { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + var(--safe-t)) 16px 0; }
  .brand { letter-spacing: .18em; font-size: 12px; font-weight: 700; }
  header button, .texty { border: 0; background: transparent; color: var(--mint); font: inherit; font-size: 13px; }
  main { flex: 1; min-height: 0; overflow: auto; padding: 8px 14px 12px; }
  .page { display: none; }
  .page.on { display: block; animation: rise .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  h1 { font-weight: 560; font-size: 28px; letter-spacing: -.03em; margin: 8px 0; }
  .muted { color: var(--muted); }
  .card {
    background: var(--glass); border: 1px solid var(--line); border-radius: 20px;
    padding: 14px; margin: 8px 0; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
  }
  .orb-wrap { display: grid; justify-items: center; padding: 8px 0 2px; }
  .orb {
    width: 132px; height: 132px; border-radius: 50%; position: relative;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), transparent 28%),
      radial-gradient(circle at 50% 55%, #1c6b58, #08382f 70%);
    box-shadow: 0 0 36px rgba(94, 240, 196, .45), inset 0 0 18px rgba(210, 255, 236, .25);
    animation: float 4.8s ease-in-out infinite;
  }
  .orb::after {
    content: "€"; position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 42px; font-weight: 300; color: #e9fff6;
  }
  .orb.near { animation-duration: 2.2s; box-shadow: 0 0 28px rgba(240, 200, 90, .55); }
  .orb.over { animation: tighten 1s ease-in-out infinite; box-shadow: 0 0 26px rgba(255, 120, 110, .6); }
  @keyframes float { 50% { transform: translateY(-7px); } }
  @keyframes tighten { 50% { transform: scale(.92); } }
  .big { font-size: 40px; font-weight: 300; letter-spacing: -.04em; text-align: center; margin: 4px 0; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.06); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip, .key, .go, .mini {
    border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--ink);
    border-radius: 14px; font: inherit;
  }
  .chip { padding: 8px 12px; }
  .chip.on { border-color: var(--mint); color: var(--mint); }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .key { height: 58px; font-size: 24px; }
  .key:active, .chip:active, .go:active, .mini:active { transform: scale(.97); }
  .go { width: 100%; margin-top: 10px; height: 48px; background: linear-gradient(90deg, #1f8f72, #3ddec0); color: #04221c; font-weight: 700; border: 0; }
  .bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #1f8f72, #8dffe0); }
  .bar.warn i { background: linear-gradient(90deg, #c9a227, #ffe08a); }
  .bar.hot i { background: linear-gradient(90deg, #c4473a, #ffb0a8); }
  .banner { border-radius: 16px; padding: 10px 12px; margin: 8px 0; background: rgba(201, 162, 39, .15); border: 1px solid rgba(255, 214, 120, .35); }
  .banner.hot { background: rgba(196, 71, 58, .16); border-color: rgba(255, 150, 140, .4); }
  .ring { width: 84px; height: 84px; }
  canvas.chart { width: 100%; height: 140px; display: block; }
  nav {
    display: flex; margin: 0 10px calc(8px + var(--safe-b)); padding: 6px; border-radius: 22px;
    background: rgba(6, 24, 20, .8); border: 1px solid var(--line); backdrop-filter: blur(16px);
  }
  nav button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 10px; padding: 6px 0; }
  nav button.on { color: var(--mint); }
  .hide { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .orb, .page.on { animation: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">VARČEVANJE</div>
  <button id="backup" type="button">Kopija</button>
</header>
<main id="app"></main>
<nav id="nav" class="hide">
  <button class="on" data-tab="home" type="button">Domov</button>
  <button data-tab="add" type="button">Vnos</button>
  <button data-tab="budget" type="button">Proračun</button>
  <button data-tab="goals" type="button">Cilji</button>
  <button data-tab="tips" type="button">Nasveti</button>
</nav>
<script>
const KEY = "varcuj.v1";
const NEEDS = new Set(["stanovanje", "poloznice", "hrana", "gorivo", "zdravje"]);
const euro = new Intl.NumberFormat("sl-SI", { style: "currency", currency: "EUR" });
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function uid() { return Math.random().toString(36).slice(2, 10); }
function monthKey(date) {
  return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0");
}
function today() {
  const date = new Date();
  return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");
}
function slug(name) { return name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, ""); }

function blank() {
  const names = ["Hrana", "Gorivo", "Stanovanje", "Položnice", "Zabava", "Oblačila", "Zdravje", "Otroci in drugo"];
  return {
    onboarded: false,
    incomeMonthly: 0,
    categories: names.map(name => ({ id: uid(), name })),
    entries: [],
    budgets: {},
    goals: [],
    subs: [],
    notified: {}
  };
}
function load() {
  try { return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); }
  catch (err) { return blank(); }
}
let state = load();
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

let tab = "home";
let draft = { type: "expense", categoryId: "", amount: "", note: "" };
let goalSeg = "goals";

function monthEntries(key) {
  return state.entries.filter(item => item.at.slice(0, 7) === key);
}
function spent(categoryId, key) {
  return monthEntries(key).filter(item => item.type === "expense" && item.categoryId === categoryId)
    .reduce((sum, item) => sum + item.amount, 0);
}
function monthExpense(key) {
  return monthEntries(key).filter(item => item.type === "expense").reduce((sum, item) => sum + item.amount, 0);
}
function alerts(key) {
  const out = [];
  state.categories.forEach(cat => {
    const limit = Number(state.budgets[cat.id] || 0);
    if (!limit) return;
    const used = spent(cat.id, key);
    const ratio = used / limit;
    if (ratio >= 1) out.push({ level: "hot", cat, ratio, text: cat.name + " je čez proračun (" + euro.format(used) + " od " + euro.format(limit) + ")." });
    else if (ratio >= 0.8) out.push({ level: "warn", cat, ratio, text: cat.name + " je pri " + Math.round(ratio * 100) + " % proračuna." });
  });
  return out;
}
function maybeNotify(list, key) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  list.forEach(item => {
    const id = key + ":" + item.cat.id + ":" + (item.level === "hot" ? "100" : "80");
    if (state.notified[id]) return;
    state.notified[id] = true;
    try { new Notification("Varčevanje", { body: item.text }); } catch (err) {}
  });
  save();
}

function tips() {
  const out = [];
  const key = monthKey(new Date());
  const expenses = monthEntries(key).filter(item => item.type === "expense");
  if (!state.entries.length && !state.subs.length && !state.goals.length) return out;
  alerts(key).forEach(item => out.push({ title: item.level === "hot" ? "Čez proračun" : "Blizu meje", text: item.text }));
  const prev = [];
  for (let i = 1; i <= 3; i++) {
    const d = new Date(); d.setMonth(d.getMonth() - i);
    prev.push(monthKey(d));
  }
  state.categories.forEach(cat => {
    const now = spent(cat.id, key);
    const older = prev.map(k => spent(cat.id, k)).filter(v => v > 0);
    if (now > 0 && older.length) {
      const avg = older.reduce((a, b) => a + b, 0) / older.length;
      if (now > avg * 1.25) out.push({ title: cat.name, text: "Ta mesec " + euro.format(now) + ", prejšnja mesečna povprečja z vnosi " + euro.format(avg) + "." });
    }
  });
  if (state.subs.length) {
    const month = state.subs.reduce((sum, sub) => sum + (sub.period === "year" ? sub.amount / 12 : sub.amount), 0);
    const year = month * 12;
    out.push({ title: "Naročnine", text: euro.format(month) + " na mesec, " + euro.format(year) + " na leto." });
    const unused = state.subs.filter(sub => sub.unused);
    if (unused.length) out.push({ title: "Neuporabljeno", text: unused.map(sub => sub.name).join(", ") + "." });
  }
  if (state.incomeMonthly > 0 && expenses.length) {
    const need = expenses.filter(item => NEEDS.has(slug(catName(item.categoryId)))).reduce((s, i) => s + i.amount, 0);
    const all = expenses.reduce((s, i) => s + i.amount, 0);
    const save = state.incomeMonthly - all;
    out.push({ title: "50/30/20", text: "Potrebe " + Math.round(need / state.incomeMonthly * 100) + " %, želje " + Math.round((all - need) / state.incomeMonthly * 100) + " %, ostanek " + Math.round(save / state.incomeMonthly * 100) + " % dohodka." });
    out.push({ title: "Stopnja varčevanja", text: save >= 0 ? "Ta mesec ostane " + euro.format(save) + "." : "Ta mesec si čez dohodek za " + euro.format(-save) + "." });
  }
  const coffee = state.entries.filter(item => /kava/i.test((item.note || "") + catName(item.categoryId)) && item.type === "expense");
  if (coffee.length) {
    const sum = coffee.reduce((s, i) => s + i.amount, 0);
    const first = coffee.reduce((min, item) => item.at < min ? item.at : min, coffee[0].at);
    const days = Math.max(1, (Date.now() - new Date(first).getTime()) / 86400000);
    out.push({ title: "Kava", text: "V vnosih je " + euro.format(sum) + ". Po tem tempu je to približno " + euro.format(sum / days * 365) + " na leto." });
  }
  return out;
}
function catName(id) { return (state.categories.find(cat => cat.id === id) || {}).name || "Brez"; }

function render() {
  const root = document.getElementById("app");
  document.getElementById("nav").classList.toggle("hide", !state.onboarded);
  if (!state.onboarded) { root.innerHTML = onboardHtml(); bindOnboard(); return; }
  const key = monthKey(new Date());
  const list = alerts(key);
  maybeNotify(list, key);
  const views = { home: homeHtml(key, list), add: addHtml(), budget: budgetHtml(key), goals: goalsHtml(), tips: tipsHtml() };
  root.innerHTML = views[tab];
  bindPage();
  drawCharts();
}
function onboardHtml() {
  return `<section class="card"><h1>Koliko ti ostane na mesec?</h1><p class="muted">Vpiši neto dohodek. Številke, ki jih ne vneseš, se ne prikažejo.</p><div class="big" id="amount">0 €</div><div class="keys" id="keys"></div><button class="go" id="go" type="button">Naprej</button></section>`;
}
function homeHtml(key, list) {
  const spentNow = monthExpense(key);
  const left = state.incomeMonthly - spentNow;
  const mode = list.some(item => item.level === "hot") ? "over" : list.length ? "near" : "";
  const banners = list.map(item => `<div class="banner ${item.level}">${item.text}</div>`).join("");
  const recent = state.entries.slice(-5).reverse().map(item => `<div class="row"><span>${item.type === "income" ? "+" : "−"} ${catName(item.categoryId)}</span><b>${euro.format(item.amount)}</b></div>`).join("");
  return `<div class="orb-wrap"><div class="orb ${mode}" id="orb"></div><div class="muted">${mode === "over" ? "čez proračun" : mode === "near" ? "blizu meje" : "v okviru"}</div></div>
    <div class="big">${euro.format(spentNow)}</div><p class="muted" style="text-align:center">odhodki ta mesec · dohodek ${euro.format(state.incomeMonthly)} · ostanek ${euro.format(left)}</p>
    ${banners || `<div class="card muted">Še ni opozoril. Meja je 80 % in 100 % proračuna.</div>`}
    <div class="card"><b>Zadnji vnosi</b>${recent || `<p class="muted">Še ni vnosov.</p>`}</div>`;
}
function addHtml() {
  const chips = state.categories.map(cat => `<button class="chip ${draft.categoryId === cat.id ? "on" : ""}" data-cat="${cat.id}" type="button">${cat.name}</button>`).join("");
  return `<div class="chips"><button class="chip ${draft.type === "expense" ? "on" : ""}" data-type="expense" type="button">Odhodek</button><button class="chip ${draft.type === "income" ? "on" : ""}" data-type="income" type="button">Dohodek</button></div>
    <div class="big" id="amount">${draft.amount || "0"} €</div>
    <div class="chips" id="cats">${chips}</div>
    <input id="note" placeholder="opomba, npr. kava" value="${draft.note.replace(/"/g, "")}" style="width:100%;margin-top:8px;padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:transparent;color:inherit;font:inherit">
    <div class="keys" id="keys"></div>
    <button class="go" id="saveEntry" type="button">Shrani</button>
    <div class="card"><b>Kategorije</b><div class="row"><input id="newcat" placeholder="nova kategorija" style="flex:1;background:transparent;border:0;color:inherit;font:inherit"><button class="mini" id="addcat" type="button">Dodaj</button></div>
    ${state.categories.map(cat => `<div class="row"><input data-rename="${cat.id}" value="${cat.name}" style="flex:1;background:transparent;border:0;color:inherit;font:inherit"></div>`).join("")}</div>`;
}
function budgetHtml(key) {
  const rows = state.categories.map(cat => {
    const limit = Number(state.budgets[cat.id] || 0);
    const used = spent(cat.id, key);
    const ratio = limit ? Math.min(1.4, used / limit) : 0;
    const klass = !limit ? "" : ratio >= 1 ? "hot" : ratio >= 0.8 ? "warn" : "";
    return `<div class="row"><span>${cat.name}<br><small class="muted">${euro.format(used)}${limit ? " / " + euro.format(limit) : ""}</small></span><input data-budget="${cat.id}" inputmode="decimal" value="${limit || ""}" placeholder="meja" style="width:88px;background:transparent;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:inherit;padding:8px"></div><div class="bar ${klass}"><i style="width:${Math.min(100, ratio * 100)}%"></i></div>`;
  }).join("");
  return `<canvas class="chart" id="bycat"></canvas><canvas class="chart" id="bymonth"></canvas><div class="card">${rows}<button class="go" id="saveBudgets" type="button">Shrani meje</button><button class="texty" id="askNotify" type="button">Lokalna obvestila, če jih brskalnik dovoli</button></div>`;
}
function goalsHtml() {
  if (goalSeg === "subs") return subsHtml();
  const cards = state.goals.map(goal => {
    const ratio = goal.target ? Math.min(1, goal.saved / goal.target) : 0;
    const months = Math.max(0, (new Date(goal.deadline) - new Date()) / (1000 * 60 * 60 * 24 * 30.44));
    const left = Math.max(0, goal.target - goal.saved);
    const need = months > 0.5 ? left / months : left;
    return `<div class="card"><b>${goal.name}</b><p class="muted">${euro.format(goal.saved)} od ${euro.format(goal.target)} · rok ${goal.deadline}</p><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3"/><circle cx="18" cy="18" r="15" fill="none" stroke="#5ef0c4" stroke-width="3" stroke-dasharray="${(ratio * 94).toFixed(1)} 94" stroke-linecap="round" transform="rotate(-90 18 18)"/></svg><p>${months > 0.5 ? "Na mesec še " + euro.format(need) : "Rok je mimo ali ta mesec. Manjka " + euro.format(left)}.</p><button class="mini" data-addsave="${goal.id}" type="button">+10 €</button></div>`;
  }).join("");
  return `<div class="chips"><button class="chip on" data-seg="goals" type="button">Cilji</button><button class="chip" data-seg="subs" type="button">Naročnine</button></div>
    ${cards || `<div class="card muted">Še ni ciljev.</div>`}
    <div class="card"><input id="gname" placeholder="ime cilja" style="width:100%;margin-bottom:8px;background:transparent;border:0;color:inherit;font:inherit"><input id="gtarget" inputmode="decimal" placeholder="znesek" style="width:48%;background:transparent;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:inherit;padding:8px"><input id="gdate" type="date" style="width:48%;background:transparent;color:inherit;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px"><button class="go" id="addgoal" type="button">Dodaj cilj</button></div>`;
}
function subsHtml() {
  const month = state.subs.reduce((sum, sub) => sum + (sub.period === "year" ? sub.amount / 12 : sub.amount), 0);
  const rows = state.subs.map(sub => `<div class="row"><span>${sub.name}<br><small class="muted">${sub.next}${sub.unused ? " · ne uporabljam" : ""}</small></span><b>${euro.format(sub.amount)} / ${sub.period === "year" ? "leto" : "mesec"}</b></div><button class="mini" data-unused="${sub.id}" type="button">${sub.unused ? "Spet uporabljam" : "Ne uporabljam"}</button> <button class="mini" data-paid="${sub.id}" type="button">Plačano</button>`).join("");
  return `<div class="chips"><button class="chip" data-seg="goals" type="button">Cilji</button><button class="chip on" data-seg="subs" type="button">Naročnine</button></div>
    <div class="card"><b>${state.subs.length ? euro.format(month) + " na mesec · " + euro.format(month * 12) + " na leto" : "Še ni naročnin."}</b>${rows}</div>
    <div class="card"><input id="sname" placeholder="ime" style="width:100%;background:transparent;border:0;color:inherit;font:inherit"><input id="samount" inputmode="decimal" placeholder="znesek" style="width:40%;background:transparent;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:inherit;padding:8px"><select id="speriod" style="background:#06211c;color:inherit;border-radius:10px;padding:8px"><option value="month">mesec</option><option value="year">leto</option></select><input id="snext" type="date" value="${today()}" style="background:transparent;color:inherit"><button class="go" id="addsub" type="button">Dodaj</button></div>`;
}
function tipsHtml() {
  const list = tips();
  if (!list.length) return `<div class="card"><h1>Nasveti</h1><p class="muted">Ko boš vnesel odhodke, naročnine ali cilje, se bodo nasveti izračunali iz teh številk. Zdaj ni podatkov.</p></div>`;
  return list.map(item => `<div class="card"><b>${item.title}</b><p>${item.text}</p></div>`).join("");
}

function keysHtml(target) {
  const keys = ["1","2","3","4","5","6","7","8","9",",","0","←"];
  target.innerHTML = keys.map(k => `<button class="key" data-key="${k}" type="button">${k}</button>`).join("");
}
function bindKeys(read, write) {
  const box = document.getElementById("keys");
  if (!box) return;
  keysHtml(box);
  box.querySelectorAll(".key").forEach(btn => btn.addEventListener("click", () => {
    let value = read();
    const key = btn.dataset.key;
    if (key === "←") value = value.slice(0, -1);
    else if (key === "," && !value.includes(",")) value += value ? "," : "0,";
    else if (key !== ",") value += key;
    write(value);
    const label = document.getElementById("amount");
    if (label) label.textContent = (value || "0") + " €";
  }));
}
function parseAmount(text) {
  const num = Number(String(text).replace(/\./g, "").replace(",", "."));
  return Number.isFinite(num) ? Math.round(num * 100) / 100 : 0;
}
function bindOnboard() {
  let value = "";
  bindKeys(() => value, v => { value = v; });
  document.getElementById("go").addEventListener("click", () => {
    const amount = parseAmount(value);
    if (amount <= 0) return;
    state.incomeMonthly = amount;
    state.onboarded = true;
    save();
    render();
  });
}
function bindPage() {
  document.querySelectorAll("nav button").forEach(btn => {
    btn.classList.toggle("on", btn.dataset.tab === tab);
    btn.onclick = () => { tab = btn.dataset.tab; render(); };
  });
  if (tab === "add") {
    if (!draft.categoryId) draft.categoryId = state.categories[0].id;
    bindKeys(() => draft.amount, v => { draft.amount = v; });
    document.querySelectorAll("[data-type]").forEach(btn => btn.onclick = () => { draft.type = btn.dataset.type; render(); });
    document.querySelectorAll("[data-cat]").forEach(btn => btn.onclick = () => { draft.categoryId = btn.dataset.cat; render(); });
    document.getElementById("note").oninput = e => { draft.note = e.target.value; };
    document.getElementById("saveEntry").onclick = () => {
      const amount = parseAmount(draft.amount);
      if (amount <= 0) return;
      state.entries.push({ id: uid(), type: draft.type, categoryId: draft.categoryId, amount, note: draft.note.trim(), at: today() });
      draft.amount = ""; draft.note = "";
      save(); tab = "home"; render();
    };
    document.getElementById("addcat").onclick = () => {
      const name = document.getElementById("newcat").value.trim();
      if (!name) return;
      state.categories.push({ id: uid(), name });
      save(); render();
    };
    document.querySelectorAll("[data-rename]").forEach(input => input.onchange = () => {
      const cat = state.categories.find(item => item.id === input.dataset.rename);
      if (cat && input.value.trim()) cat.name = input.value.trim();
      save();
    });
  }
  if (tab === "budget") {
    document.getElementById("saveBudgets").onclick = () => {
      document.querySelectorAll("[data-budget]").forEach(input => { state.budgets[input.dataset.budget] = parseAmount(input.value); });
      save(); render();
    };
    document.getElementById("askNotify").onclick = async () => {
      if (!("Notification" in window)) return;
      await Notification.requestPermission();
    };
  }
  if (tab === "goals") {
    document.querySelectorAll("[data-seg]").forEach(btn => btn.onclick = () => { goalSeg = btn.dataset.seg; render(); });
    const addGoal = document.getElementById("addgoal");
    if (addGoal) addGoal.onclick = () => {
      const name = document.getElementById("gname").value.trim();
      const target = parseAmount(document.getElementById("gtarget").value);
      const deadline = document.getElementById("gdate").value;
      if (!name || target <= 0 || !deadline) return;
      state.goals.push({ id: uid(), name, target, deadline, saved: 0 });
      save(); render();
    };
    document.querySelectorAll("[data-addsave]").forEach(btn => btn.onclick = () => {
      const goal = state.goals.find(item => item.id === btn.dataset.addsave);
      if (goal) goal.saved = Math.round((goal.saved + 10) * 100) / 100;
      save(); render();
    });
    const addSub = document.getElementById("addsub");
    if (addSub) addSub.onclick = () => {
      const name = document.getElementById("sname").value.trim();
      const amount = parseAmount(document.getElementById("samount").value);
      if (!name || amount <= 0) return;
      state.subs.push({ id: uid(), name, amount, period: document.getElementById("speriod").value, next: document.getElementById("snext").value || today(), unused: false });
      save(); render();
    };
    document.querySelectorAll("[data-unused]").forEach(btn => btn.onclick = () => {
      const sub = state.subs.find(item => item.id === btn.dataset.unused);
      if (sub) sub.unused = !sub.unused;
      save(); render();
    });
    document.querySelectorAll("[data-paid]").forEach(btn => btn.onclick = () => {
      const sub = state.subs.find(item => item.id === btn.dataset.paid);
      if (!sub) return;
      const date = new Date(sub.next || today());
      if (sub.period === "year") date.setFullYear(date.getFullYear() + 1);
      else date.setMonth(date.getMonth() + 1);
      sub.next = date.toISOString().slice(0, 10);
      save(); render();
    });
  }
}
function drawCharts() {
  const bycat = document.getElementById("bycat");
  const bymonth = document.getElementById("bymonth");
  if (!bycat || !bymonth) return;
  const key = monthKey(new Date());
  const rows = state.categories.map(cat => ({ name: cat.name, value: spent(cat.id, key) })).filter(row => row.value > 0);
  bars(bycat, rows.map(row => row.value), rows.map(row => row.name));
  const labels = [];
  const values = [];
  for (let i = 5; i >= 0; i--) {
    const date = new Date(); date.setMonth(date.getMonth() - i);
    const k = monthKey(date);
    labels.push(k.slice(5));
    values.push(monthExpense(k));
  }
  if (values.every(v => v === 0)) bars(bymonth, [], []);
  else bars(bymonth, values, labels);
}
function bars(canvas, values, labels) {
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(2, devicePixelRatio || 1);
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);
  if (!values.length) {
    ctx.fillStyle = "#9bb3a8";
    ctx.font = "14px sans-serif";
    ctx.fillText("Še ni podatkov za graf.", 8, h / 2);
    return;
  }
  const max = Math.max(...values, 1);
  const gap = 8;
  const bw = (w - gap * (values.length + 1)) / values.length;
  values.forEach((value, i) => {
    const bh = (value / max) * (h - 28);
    const x = gap + i * (bw + gap);
    ctx.fillStyle = "#5ef0c4";
    ctx.fillRect(x, h - 18 - bh, bw, bh);
    ctx.fillStyle = "#9bb3a8";
    ctx.font = "10px sans-serif";
    ctx.fillText(labels[i].slice(0, 8), x, h - 4);
  });
}
document.getElementById("backup").onclick = () => {
  const choice = prompt("Vpiši 'izvozi' za kopijo ali prilepi JSON za uvoz.");
  if (!choice) return;
  if (choice.trim().toLowerCase() === "izvozi") {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "varcevanje.json";
    link.click();
    return;
  }
  try {
    const next = JSON.parse(choice);
    if (!next || !Array.isArray(next.categories) || !Array.isArray(next.entries)) return;
    state = Object.assign(blank(), next);
    save(); render();
  } catch (err) {}
};
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
