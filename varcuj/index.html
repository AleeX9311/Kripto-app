<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#041510">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Varčevanje</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="import.js"></script>
<style>
  :root {
    --ink:#f4fff9; --muted:#93b3a6; --mint:#5ef0c4; --line:rgba(255,255,255,.12);
    --glass:rgba(8,32,26,.72); --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:#041510; color:var(--ink); }
  body {
    height:100dvh; display:flex; flex-direction:column; overflow:hidden;
    font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    font-variant-numeric:tabular-nums;
    background:
      radial-gradient(520px 280px at 80% -10%, rgba(40,200,150,.45), transparent 60%),
      radial-gradient(420px 240px at -10% 20%, rgba(20,120,90,.35), transparent 70%),
      #041510;
  }
  header,main,nav,.sheet,.toast { position:relative; z-index:1; }
  header { display:flex; justify-content:space-between; align-items:flex-start; padding:calc(8px + var(--safe-t)) 16px 0; }
  h1 { margin:0; font-size:28px; font-weight:650; letter-spacing:-.03em; }
  .month { border:0; background:transparent; color:var(--muted); font:inherit; padding:0; }
  .iconbtn { border:0; background:rgba(255,255,255,.06); color:var(--ink); width:36px; height:36px; border-radius:50%; }
  main { flex:1; min-height:0; overflow:auto; padding:8px 14px 88px; }
  .card {
    background:var(--glass); border:1px solid var(--line); border-radius:22px; padding:14px; margin:8px 0;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
  }
  .hero { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; }
  .hero b { display:block; font-size:34px; font-weight:620; letter-spacing:-.04em; }
  .muted { color:var(--muted); font-size:13px; }
  .chips { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .chip { border-radius:16px; padding:10px 8px; background:rgba(255,255,255,.04); border:1px solid var(--line); font-size:12px; }
  .chip b { display:block; font-size:13px; margin-top:4px; }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:center; padding:8px 0; }
  .bar { height:8px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg,#1f8f72,#b8ffe8); }
  .bar.warn i { background:linear-gradient(90deg,#c9a227,#ffe08a); }
  .bar.hot i { background:linear-gradient(90deg,#c4473a,#ffb0a8); }
  .ico { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; flex:none; }
  .tx { position:relative; overflow:hidden; border-radius:16px; margin:6px 0; }
  .tx-actions { position:absolute; inset:0 0 0 auto; width:148px; display:flex; z-index:0; }
  .tx-main { z-index:1; width:100%; }
  .tx-actions button { flex:1; border:0; color:#04221c; font:inherit; font-size:13px; font-weight:700; }
  .tx-actions .edit { background:#8dffe0; }
  .tx-actions .del { background:#ffb0a8; }
  .tx-main { position:relative; background:rgba(6,28,24,.92); border:1px solid var(--line); border-radius:16px; padding:10px 12px; display:flex; justify-content:space-between; gap:8px; transition:transform .22s cubic-bezier(.2,.8,.2,1); }
  .tx.open .tx-main { transform:translateX(-148px); }
  .fab {
    position:fixed; right:22px; bottom:calc(78px + var(--safe-b)); z-index:3; width:62px; height:62px; border-radius:50%; border:0;
    background:radial-gradient(circle at 35% 30%, #d9fff2, #1f8f72 55%, #0c5c48);
    color:#04221c; font-size:34px; box-shadow:0 0 24px rgba(94,240,196,.65);
  }
  .fab:active { transform:scale(.94); }
  nav {
    position:fixed; left:10px; right:10px; bottom:calc(8px + var(--safe-b)); z-index:4; display:flex;
    padding:8px 4px 6px; border-radius:24px; background:rgba(6,22,18,.78); border:1px solid var(--line);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  }
  nav button { flex:1; border:0; background:transparent; color:var(--muted); font:inherit; font-size:10px; }
  nav button.on { color:var(--mint); }
  .sheet {
    position:fixed; inset:0; z-index:6; background:rgba(0,0,0,.45); display:flex; align-items:flex-end;
  }
  .panel {
    width:100%; max-height:92dvh; overflow:auto; background:#07241d; border-radius:24px 24px 0 0; padding:16px 16px calc(18px + var(--safe-b));
    box-shadow:0 -20px 60px rgba(0,0,0,.4);
  }
  .keys { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .key,.go,.mini { border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--ink); border-radius:14px; font:inherit; }
  .key { height:54px; font-size:22px; }
  .key:active,.go:active,.mini:active { transform:scale(.97); }
  .go { width:100%; height:48px; margin-top:8px; border:0; font-weight:750; background:linear-gradient(90deg,#1f8f72,#3ddec0); color:#04221c; }
  .sel { padding:8px 10px; border-radius:12px; border:1px solid var(--line); background:transparent; color:inherit; }
  .sel.on { border-color:var(--mint); color:var(--mint); }
  .toast {
    position:fixed; left:16px; right:16px; bottom:calc(84px + var(--safe-b)); z-index:7;
    background:rgba(8,28,24,.94); border:1px solid var(--line); border-radius:16px; padding:12px 14px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .lock { padding:24px 16px; }
  canvas.chart { width:100%; height:150px; display:block; }
  .hide { display:none; }
  @media (prefers-reduced-motion: reduce) { .tx-main { transition:none; } }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="hello">Varčevanje</h1>
    <span><button class="month" id="monthPrev" type="button">‹</button> <button class="month" id="monthBtn" type="button"></button> <button class="month" id="monthNext" type="button">›</button></span>
  </div>
  <button class="iconbtn" id="settingsBtn" type="button" aria-label="Nastavitve">⚙</button>
</header>
<main id="app"></main>
<button class="fab" id="fab" type="button">+</button>
<nav id="nav">
  <button data-tab="home" type="button">Domov</button>
  <button data-tab="spend" type="button">Stroški</button>
  <button data-tab="goals" type="button">Cilji</button>
  <button data-tab="subs" type="button">Naročnine</button>
  <button data-tab="tips" type="button">Nasveti</button>
</nav>
<div id="sheet"></div>
<div id="toast"></div>
<script>
const KEY = "varcuj.v1";
const euro = new Intl.NumberFormat("sl-SI", { style: "currency", currency: "EUR" });
const NEEDS = new Set(["hrana", "gorivo", "stanovanje", "poloznice", "zdravje"]);
function uid() { return Math.random().toString(36).slice(2, 9); }
function pad(n) { return String(n).padStart(2, "0"); }
function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function today() { return iso(new Date()); }
function monthKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1); }
function parseAmount(text) {
  const n = Number(String(text || "").replace(/\s/g, "").replace(/\./g, "").replace(",", "."));
  return Number.isFinite(n) ? Math.round(n * 100) / 100 : 0;
}
function addMonths(value, n) {
  const d = new Date(value + "T12:00:00");
  d.setMonth(d.getMonth() + n);
  return iso(d);
}
function slug(name) { return (name || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
function defaultCategories() {
  return ["Hrana", "Gorivo", "Stanovanje", "Položnice", "Zabava", "Oblačila", "Zdravje", "Otroci in drugo"].map(name => ({ id: uid(), name }));
}
function blank() {
  return { onboarded: false, name: "", pinHash: "", incomeMonthly: 0, categories: defaultCategories(), entries: [], budgets: {}, goals: [], subs: [], recurring: [], challenges: { nospend: null, week52: null }, notified: {}, learned: [], importMaps: {} };
}
function load() {
  try { return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); }
  catch (e) { return blank(); }
}
let state = load();
let unlocked = !state.pinHash;
let tab = "home";
let view = new Date();
let sheet = null;
let undo = null;
let openTx = null;
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function cat(id) { return state.categories.find(item => item.id === id) || { name: "Brez", id: "" }; }
function inMonth(item, key) { return (item.at || "").slice(0, 7) === key; }
function monthItems(key) { return state.entries.filter(item => inMonth(item, key)); }
function spentCat(id, key) { return monthItems(key).filter(i => i.type === "expense" && i.categoryId === id).reduce((s, i) => s + i.amount, 0); }
function sumType(key, type) { return monthItems(key).filter(i => i.type === type).reduce((s, i) => s + i.amount, 0); }
function incomeOf(key) { return state.incomeMonthly + sumType(key, "income"); }
function expenseOf(key) { return sumType(key, "expense"); }
function leftOf(key) { return incomeOf(key) - expenseOf(key); }
function greet() {
  const hour = Number(new Intl.DateTimeFormat("en-GB", { hour: "numeric", hourCycle: "h23", timeZone: "Europe/Ljubljana" }).format(new Date()));
  const word = hour < 10 ? "Dobro jutro" : hour < 18 ? "Dober dan" : "Dober večer";
  return state.name ? word + ", " + state.name : word;
}
function monthLabel(d) {
  return new Intl.DateTimeFormat("sl-SI", { month: "long", year: "numeric" }).format(d);
}
function rollRecurring() {
  const end = today();
  let changed = false;
  (state.recurring || []).forEach(rule => {
    let guard = 0;
    while (rule.next && rule.next <= end && guard < 36) {
      state.entries.push({ id: uid(), type: rule.type, categoryId: rule.categoryId, amount: rule.amount, note: rule.note || "", at: rule.next, method: rule.method || "card", recurringId: rule.id });
      rule.next = rule.every === "year" ? addMonths(rule.next, 12) : addMonths(rule.next, 1);
      changed = true; guard++;
    }
  });
  if (changed) save();
}
rollRecurring();

async function sha(text) {
  const data = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function buzz() { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} }

function alerts(key) {
  return state.categories.flatMap(item => {
    const limit = Number(state.budgets[item.id] || 0);
    if (!limit) return [];
    const used = spentCat(item.id, key);
    const ratio = used / limit;
    if (ratio >= 1) return [{ level: "hot", cat: item, ratio, text: item.name + " je čez proračun (" + euro.format(used) + " od " + euro.format(limit) + ")." }];
    if (ratio >= 0.8) return [{ level: "warn", cat: item, ratio, text: item.name + " je pri " + Math.round(ratio * 100) + " % proračuna." }];
    return [];
  });
}
function mood(key) {
  const list = alerts(key);
  if (list.some(item => item.level === "hot") || leftOf(key) < 0) return "over";
  if (list.length) return "near";
  return "calm";
}

function tips() {
  const out = [];
  const key = monthKey(view);
  if (!state.entries.length && !state.subs.length && !state.goals.length) return out;
  alerts(key).forEach(item => out.push({ title: item.level === "hot" ? "Čez proračun" : "Blizu meje", text: item.text }));
  state.categories.forEach(item => {
    const now = spentCat(item.id, key);
    const older = [];
    for (let i = 1; i <= 3; i++) {
      const d = new Date(view); d.setMonth(d.getMonth() - i);
      const v = spentCat(item.id, monthKey(d));
      if (v > 0) older.push(v);
    }
    if (now > 0 && older.length) {
      const avg = older.reduce((a, b) => a + b, 0) / older.length;
      if (now > avg * 1.25) out.push({ title: item.name, text: "Ta mesec " + euro.format(now) + ", povprečje prejšnjih mesecev z vnosi " + euro.format(avg) + "." });
    }
  });
  if (state.subs.length) {
    const perMonth = state.subs.reduce((s, sub) => s + (sub.period === "year" ? sub.amount / 12 : sub.amount), 0);
    out.push({ title: "Naročnine", text: euro.format(perMonth) + " na mesec, " + euro.format(perMonth * 12) + " na leto." });
    const unused = state.subs.filter(sub => sub.unused);
    if (unused.length) out.push({ title: "Ne uporabljaš", text: unused.map(sub => sub.name).join(", ") + "." });
  }
  const expenses = monthItems(key).filter(i => i.type === "expense");
  if (state.incomeMonthly > 0 && expenses.length) {
    const needs = expenses.filter(i => NEEDS.has(slug(cat(i.categoryId).name))).reduce((s, i) => s + i.amount, 0);
    const all = expenses.reduce((s, i) => s + i.amount, 0);
    const rest = incomeOf(key) - all;
    out.push({ title: "50/30/20", text: "Potrebe " + Math.round(needs / incomeOf(key) * 100) + " %, želje " + Math.round(Math.max(0, all - needs) / incomeOf(key) * 100) + " %, ostanek " + Math.round(rest / incomeOf(key) * 100) + " % prihodkov tega meseca." });
    out.push({ title: "Stopnja varčevanja", text: rest >= 0 ? "Ostane " + euro.format(rest) + "." : "Čez prihodke za " + euro.format(-rest) + "." });
  }
  const coffee = state.entries.filter(i => i.type === "expense" && /kava/i.test((i.note || "") + " " + cat(i.categoryId).name));
  if (coffee.length) {
    const sum = coffee.reduce((s, i) => s + i.amount, 0);
    const first = coffee.reduce((m, i) => i.at < m ? i.at : m, coffee[0].at);
    const days = Math.max(1, (Date.now() - new Date(first + "T12:00:00").getTime()) / 86400000);
    out.push({ title: "Kava", text: "V vnosih je " + euro.format(sum) + ". Po tem tempu približno " + euro.format(sum / days * 365) + " na leto." });
  }
  const cash = expenses.filter(i => i.method === "cash").reduce((s, i) => s + i.amount, 0);
  const card = expenses.filter(i => i.method !== "cash").reduce((s, i) => s + i.amount, 0);
  if (cash || card) out.push({ title: "Gotovina in kartica", text: "Gotovina " + euro.format(cash) + ", kartica " + euro.format(card) + "." });
  return out;
}

function paint() {
  document.getElementById("hello").textContent = state.onboarded ? greet() : "Varčevanje";
  document.getElementById("monthBtn").textContent = monthLabel(view) + " ▾";
  document.getElementById("nav").classList.toggle("hide", !state.onboarded || !unlocked);
  document.getElementById("fab").classList.toggle("hide", !state.onboarded || !unlocked);
  document.querySelectorAll("nav button").forEach(btn => btn.classList.toggle("on", btn.dataset.tab === tab));
  const app = document.getElementById("app");
  if (!unlocked) { app.innerHTML = lockHtml(); bindLock(); sheetClose(); return; }
  if (!state.onboarded) { app.innerHTML = onboardHtml(); bindOnboard(); sheetClose(); return; }
  const key = monthKey(view);
  const pages = { home: homeHtml(key), spend: spendHtml(key), goals: goalsHtml(), subs: subsHtml(), tips: tipsHtml() };
  app.innerHTML = pages[tab] || homeHtml(key);
  bindPage();
  drawCharts();
  renderSheet();
}
function homeHtml(key) {
  const list = alerts(key);
  const spent = expenseOf(key);
  const income = incomeOf(key);
  const left = leftOf(key);
  const ratio = income > 0 ? Math.min(1, spent / income) : 0;
  const face = mood(key);
  const budgets = state.categories.filter(item => state.budgets[item.id] || spentCat(item.id, key)).slice(0, 4);
  const goal = state.goals[0];
  const tip = tips()[0];
  const recent = state.entries.filter(item => inMonth(item, key)).slice(-6).reverse();
  return `<article class="card hero">
      <div><div class="muted">Ostane ta mesec</div><b id="leftNum">${euro.format(left)}</b><div class="muted">${income ? "Porabljeno prihodkov " + Math.round(spent / income * 100) + " %" : "Še ni prihodka"}</div></div>
      <div style="display:flex;align-items:center;gap:8px">
        <svg width="64" height="64" viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="4"/><circle cx="18" cy="18" r="14" fill="none" stroke="${face === "over" ? "#ff8d84" : face === "near" ? "#ffd36a" : "#5ef0c4"}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(ratio * 88).toFixed(1)} 88" transform="rotate(-90 18 18)"/></svg>
        <div class="orb ${face}"></div>
      </div>
    </article>
    <div class="chips">
      <div class="chip"><span class="muted">Prihodki</span><b>${euro.format(income)}</b></div>
      <div class="chip"><span class="muted">Stroški</span><b>${euro.format(spent)}</b></div>
      <div class="chip"><span class="muted">Privarčevano</span><b>${euro.format(left)}</b></div>
    </div>
    ${list.map(item => `<div class="card" style="border-color:${item.level === "hot" ? "#ffb0a8" : "#ffe08a"}">${item.text}</div>`).join("")}
    <article class="card"><div class="row"><b>Proračuni</b></div>
      ${budgets.length ? budgets.map(item => budgetRow(item, key)).join("") : `<p class="muted">Še ni proračuna. Mejo dodaš pri kategoriji.</p>`}
    </article>
    <div class="chips">
      <article class="card">${goal ? `<b>Cilji</b><p>${goal.name}<br>${euro.format(goal.saved)} od ${euro.format(goal.target)}</p>` : `<b>Cilji</b><p class="muted">Še ni cilja.</p>`}</article>
      <article class="card"><b>Nasvet</b><p class="muted">${tip ? tip.text : "Nasvet se pokaže, ko je kaj za izračunati."}</p></article>
    </div>
    <article class="card"><div class="row"><b>Zadnje transakcije</b></div>
      ${recent.length ? recent.map(txHtml).join("") : `<p class="muted">Še ni vnosov.</p>`}
    </article>`;
}
function budgetRow(item, key) {
  const limit = Number(state.budgets[item.id] || 0);
  const used = spentCat(item.id, key);
  const ratio = limit ? used / limit : 0;
  const klass = !limit ? "" : ratio >= 1 ? "hot" : ratio >= 0.8 ? "warn" : "";
  return `<button class="row" data-budget-edit="${item.id}" type="button" style="width:100%;background:none;border:0;color:inherit;text-align:left">
    <span class="ico" style="background:${color(item.name)}">${glyph(item.name)}</span>
    <span style="flex:1">${item.name}<br><span class="muted">${limit ? "Od " + euro.format(limit) : "Brez meje"}</span><span class="bar ${klass}"><i style="width:${Math.min(100, ratio * 100)}%"></i></span></span>
    <b>${limit ? Math.round(ratio * 100) + " %" : euro.format(used)}</b></button>`;
}
function color(name) {
  const map = { hrana: "#1f8f72", gorivo: "#6d5efc", stanovanje: "#3d7bd6", poloznice: "#c9a227", zabava: "#d45d9b", oblacila: "#2a9d8f", zdravje: "#d45d5d" };
  return map[slug(name)] || "#1f8f72";
}
function glyph(name) {
  const s = slug(name);
  if (s.includes("gorivo")) return "⛽";
  if (s.includes("stanovan")) return "⌂";
  if (s.includes("zabava")) return "★";
  if (s.includes("zdrav")) return "+";
  if (s.includes("oblac")) return "◒";
  return "●";
}
function txHtml(item) {
  const sign = item.type === "income" ? "+" : "−";
  return `<div class="tx ${openTx === item.id ? "open" : ""}" data-tx="${item.id}">
    <div class="tx-actions"><button class="edit" data-edit="${item.id}" type="button">Uredi</button><button class="del" data-del="${item.id}" type="button">Izbriši</button></div>
    <div class="tx-main"><span>${cat(item.categoryId).name}<br><small class="muted">${item.at} · ${item.method === "cash" ? "gotovina" : "kartica"}</small></span><b>${sign}${euro.format(item.amount)}</b></div>
  </div>`;
}
function spendHtml(key) {
  const q = (sheet && sheet.search) || "";
  const filter = (sheet && sheet.filter) || "all";
  let items = monthItems(key).slice().reverse();
  if (q) items = items.filter(item => (cat(item.categoryId).name + " " + (item.note || "")).toLowerCase().includes(q.toLowerCase()));
  if (filter === "expense" || filter === "income") items = items.filter(item => item.type === filter);
  if (filter === "cash" || filter === "card") items = items.filter(item => (item.method || "card") === filter);
  return `<div class="card"><input id="search" placeholder="Išči" value="${q.replace(/"/g, "")}" style="width:100%;background:transparent;border:0;color:inherit;font:inherit">
    <div class="row">${["all", "expense", "income", "cash", "card"].map(name => `<button class="sel ${filter === name ? "on" : ""}" data-filter="${name}" type="button">${{all:"vse",expense:"stroški",income:"prihodki",cash:"gotovina",card:"kartica"}[name]}</button>`).join("")}</div></div>
    <canvas class="chart" id="donut"></canvas><canvas class="chart" id="months"></canvas>
    <article class="card">${items.length ? items.map(txHtml).join("") : `<p class="muted">Ni vnosov za ta filter.</p>`}</article>`;
}
function goalsHtml() {
  const cards = state.goals.map(goal => {
    const ratio = goal.target ? Math.min(1, goal.saved / goal.target) : 0;
    const months = Math.max(0, (new Date(goal.deadline + "T12:00:00") - new Date()) / (1000 * 60 * 60 * 24 * 30.44));
    const left = Math.max(0, goal.target - goal.saved);
    const need = months >= 1 ? left / months : left;
    return `<article class="card"><div class="row"><b>${goal.name}</b><button class="mini" data-goal="${goal.id}" type="button">Uredi</button></div>
      <p>${euro.format(goal.saved)} od ${euro.format(goal.target)}</p>
      <svg width="72" height="72" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3"/><circle cx="18" cy="18" r="15" fill="none" stroke="#5ef0c4" stroke-width="3" stroke-dasharray="${(ratio * 94).toFixed(1)} 94" transform="rotate(-90 18 18)"/></svg>
      <p class="muted">${months >= 1 ? "Na mesec še " + euro.format(need) : "Manjka " + euro.format(left) + " do roka."}</p>
      <button class="mini" data-deposit="${goal.id}" type="button">Vplačilo</button> <button class="mini" data-withdraw="${goal.id}" type="button">Dvigni</button></article>`;
  }).join("");
  const streak = noSpendStreak();
  const week = week52();
  return `${cards || `<article class="card muted">Še ni ciljev.</article>`}
    <article class="card"><b>Nov cilj</b><button class="go" id="newGoal" type="button">Dodaj cilj</button></article>
    <article class="card"><b>Izziv brez stroškov</b><p class="muted">${state.challenges.nospend ? "Niz " + streak + " dni brez odhodka." : "Še ni začet."}</p><button class="mini" id="nospend" type="button">${state.challenges.nospend ? "Označi danes" : "Začni"}</button></article>
    <article class="card"><b>52 tednov</b><p class="muted">${week.text}</p><button class="mini" id="week52" type="button">${state.challenges.week52 ? "Ta teden vplačan" : "Začni"}</button></article>`;
}
function noSpendStreak() {
  if (!state.challenges.nospend) return 0;
  let n = 0;
  const d = new Date();
  for (let i = 0; i < 400; i++) {
    const key = iso(d);
    if (key < state.challenges.nospend) break;
    const spent = state.entries.some(item => item.at === key && item.type === "expense");
    if (spent) break;
    n++; d.setDate(d.getDate() - 1);
  }
  return n;
}
function week52() {
  const start = state.challenges.week52;
  if (!start) return { text: "Še ni začet. Teden 1 je 1 €, teden 2 je 2 €." };
  const weeks = Math.max(1, Math.floor((Date.now() - new Date(start + "T12:00:00").getTime()) / (7 * 86400000)) + 1);
  const n = Math.min(52, weeks);
  const done = (state.challenges.weekDone || []).includes(n);
  return { n, done, text: "Teden " + n + " od 52. Ta teden " + euro.format(n) + (done ? ". Vplačano." : ".") };
}

function keypad(read, write) {

function drawCharts() {
  const donut = document.getElementById("donut");
  const months = document.getElementById("months");
  if (!donut) return;
  const key = monthKey(view);
  const parts = state.categories.map(item => ({ name: item.name, value: spentCat(item.id, key) })).filter(p => p.value > 0);
  const ctx = donut.getContext("2d");
  fit(donut, ctx);
  const w = donut.clientWidth, h = donut.clientHeight;
  ctx.clearRect(0, 0, w, h);
  const total = parts.reduce((s, p) => s + p.value, 0);
  if (!total) { ctx.fillStyle = "#93b3a6"; ctx.font = "14px sans-serif"; ctx.fillText("Še ni stroškov za torto.", 8, h / 2); }
  else {
    let angle = -Math.PI / 2;
    const colors = ["#5ef0c4", "#6d5efc", "#3d7bd6", "#ffd36a", "#d45d9b", "#ff8d84", "#8dffe0", "#c9a227"];
    parts.forEach((part, i) => {
      const slice = part.value / total * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(70, h / 2); ctx.arc(70, h / 2, 52, angle, angle + slice); ctx.fillStyle = colors[i % colors.length]; ctx.fill();
      angle += slice;
    });
    ctx.fillStyle = "#041510"; ctx.beginPath(); ctx.arc(70, h / 2, 30, 0, 7); ctx.fill();
    ctx.fillStyle = "#f4fff9"; ctx.font = "12px sans-serif"; ctx.fillText(euro.format(total), 108, h / 2);
  }
  const labels = [], values = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(view); d.setMonth(d.getMonth() - i);
    labels.push(monthKey(d).slice(5));
    values.push(expenseOf(monthKey(d)));
  }
  const c2 = months.getContext("2d");
  fit(months, c2);
  const W = months.clientWidth, H = months.clientHeight;
  c2.clearRect(0, 0, W, H);
  if (values.every(v => v === 0)) { c2.fillStyle = "#93b3a6"; c2.font = "14px sans-serif"; c2.fillText("Še ni mesečnega trenda.", 8, H / 2); return; }
  const max = Math.max(...values, 1);
  values.forEach((value, i) => {
    const bw = (W - 40) / values.length;
    const bh = value / max * (H - 24);
    c2.fillStyle = "#5ef0c4";
    c2.fillRect(8 + i * bw, H - 16 - bh, bw - 8, bh);
    c2.fillStyle = "#93b3a6"; c2.font = "10px sans-serif"; c2.fillText(labels[i], 8 + i * bw, H - 4);
  });
}
function fit(canvas, ctx) {
  const dpr = Math.min(2, devicePixelRatio || 1);
  canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

async function saveSheet() {
  const amount = parseAmount(sheet.amount);
  if (sheet.kind === "entry") {
    if (amount <= 0 || !sheet.at) return;
    let entry = state.entries.find(item => item.id === sheet.id);
    if (!entry) { entry = { id: uid() }; state.entries.push(entry); }
    Object.assign(entry, { type: sheet.type, categoryId: sheet.categoryId, amount, note: (document.getElementById("note") || {}).value || sheet.note || "", at: sheet.at, method: sheet.method });
    if (entry.merchant) {
      state.learned = (state.learned || []).filter(rule => VarcujImport.norm(rule.merchant) !== VarcujImport.norm(entry.merchant));
      state.learned.push({ merchant: entry.merchant, categoryId: entry.categoryId });
    }
    if (sheet.recurring) {
      const rule = { id: entry.recurringId || uid(), type: entry.type, categoryId: entry.categoryId, amount, note: entry.note, method: entry.method, every: "month", next: addMonths(entry.at, 1) };
      entry.recurringId = rule.id;
      state.recurring = (state.recurring || []).filter(item => item.id !== rule.id).concat(rule);
    } else if (entry.recurringId) {
      state.recurring = (state.recurring || []).filter(item => item.id !== entry.recurringId);
      delete entry.recurringId;
    }
  } else if (sheet.kind === "budget") {
    if (amount > 0) state.budgets[sheet.id] = amount; else delete state.budgets[sheet.id];
  } else if (sheet.kind === "goal") {
    const name = document.getElementById("gname").value.trim();
    const deadline = document.getElementById("gdate").value;
    if (!name || amount <= 0 || !deadline) return;
    if (sheet.id) {
      const goal = state.goals.find(item => item.id === sheet.id);
      Object.assign(goal, { name, target: amount, deadline });
    } else state.goals.push({ id: uid(), name, target: amount, deadline, saved: 0 });
  } else if (sheet.kind === "move") {
    const goal = state.goals.find(item => item.id === sheet.id);
    if (!goal || amount <= 0) return;
    goal.saved = Math.max(0, Math.round((goal.saved + sheet.dir * amount) * 100) / 100);
  } else if (sheet.kind === "sub") {
    const name = document.getElementById("sname").value.trim();
    if (!name || amount <= 0) return;
    const next = { name, amount, period: document.getElementById("speriod").value, next: document.getElementById("snext").value || today(), unused: document.getElementById("sunused").checked };
    if (sheet.id) Object.assign(state.subs.find(item => item.id === sheet.id), next);
    else state.subs.push(Object.assign({ id: uid() }, next));
  } else if (sheet.kind === "settings") {
    const income = parseAmount(sheet.amount);
    if (income <= 0) return;
    state.name = document.getElementById("setName").value.trim();
    state.incomeMonthly = income;
    const pin = document.getElementById("setPin").value.trim();
    if (pin) state.pinHash = await sha(pin);
    else state.pinHash = "";
  }
  save(); sheet = null; paint();
}
function deleteSheet() {
  if (sheet.kind === "entry") removeEntry(sheet.id);
  else if (sheet.kind === "budget") delete state.budgets[sheet.id];
  else if (sheet.kind === "goal") state.goals = state.goals.filter(item => item.id !== sheet.id);
  else if (sheet.kind === "sub") state.subs = state.subs.filter(item => item.id !== sheet.id);
  save(); sheet = null; paint();
}
function removeEntry(id) {
  const index = state.entries.findIndex(item => item.id === id);
  if (index < 0) return;
  const [item] = state.entries.splice(index, 1);
  save();
  if (undo && undo.timer) clearTimeout(undo.timer);
  undo = { item, index };
  showUndo();
  undo.timer = setTimeout(() => { undo = null; document.getElementById("toast").innerHTML = ""; }, 5000);
  sheet = null; openTx = null; paint();
}
function showUndo() {
  const toast = document.getElementById("toast");
  toast.innerHTML = `<span>Izbrisano</span><button class="mini" id="undoBtn" type="button">Razveljavi</button>`;
  document.getElementById("undoBtn").onclick = () => {
    if (!undo) return;
    state.entries.splice(undo.index, 0, undo.item);
    clearTimeout(undo.timer); undo = null; save();
    toast.innerHTML = ""; paint();
  };
}
function exportCSV() {
  const lines = [["datum", "tip", "kategorija", "znesek", "opomba", "nacin"]];
  state.entries.forEach(item => lines.push([item.at, item.type, cat(item.categoryId).name, String(item.amount).replace(".", ","), item.note || "", item.method || "card"]));
  download(lines.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(";")).join("\n"), "varcevanje.csv", "text/csv");
}
function exportJSON() { download(JSON.stringify(state, null, 2), "varcevanje.json", "application/json"); }
async function readBank(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  try {
    const parsed = await VarcujImport.parseBuffer(await file.arrayBuffer());
    const remembered = (state.importMaps || {})[parsed.signature];
    showImport(parsed, remembered || parsed.mapping, remembered ? true : parsed.sure);
  } catch (err) {
    document.getElementById("toast").textContent = err.message || "Izpiska ni bilo mogoče prebrati.";
  }
  event.target.value = "";
}
function showImport(parsed, mapping, sure) {
  const preview = VarcujImport.preview(parsed.body || sheet.body, mapping).map(tx => {
    const categoryId = VarcujImport.categorize(tx.desc, state.learned, state.categories);
    return Object.assign({}, tx, { categoryId, categoryName: categoryId ? cat(categoryId).name : "brez" });
  });
  sheet = {
    kind: "import",
    headers: parsed.headers || sheet.headers,
    body: parsed.body || sheet.body,
    mapping, sure,
    encoding: parsed.encoding || sheet.encoding,
    delimiter: parsed.delimiter || sheet.delimiter,
    signature: parsed.signature || sheet.signature,
    preview,
    subs: VarcujImport.suggestRecurring(preview)
  };
  renderSheet();
}
function remapImport() {
  const mapping = {};
  document.querySelectorAll("[data-map]").forEach(select => { mapping[select.dataset.map] = Number(select.value); });
  showImport(sheet, mapping, false);
}
function commitImport() {
  const existing = new Set(state.entries.map(item => item.importKey).filter(Boolean));
  let added = 0, skipped = 0;
  (sheet.preview || []).forEach(tx => {
    const key = VarcujImport.fingerprint(tx);
    if (existing.has(key)) { skipped++; return; }
    existing.add(key);
    state.entries.push({ id: uid(), type: tx.type, categoryId: tx.categoryId || "", amount: tx.abs, note: tx.desc, at: tx.date, method: "card", merchant: tx.desc, importKey: key });
    added++;
  });
  document.querySelectorAll("[data-subpick]").forEach(box => {
    if (!box.checked) return;
    const sub = sheet.subs[Number(box.dataset.subpick)];
    if (!sub || state.subs.some(item => VarcujImport.norm(item.name) === VarcujImport.norm(sub.name))) return;
    state.subs.push({ id: uid(), name: sub.name, amount: sub.amount, period: sub.period, next: sub.next, unused: false });
  });
  state.importMaps = state.importMaps || {};
  state.importMaps[sheet.signature] = sheet.mapping;
  save();
  const note = "Uvoženih " + added + ", preskočenih " + skipped + ".";
  sheet = null;
  paint();
  document.getElementById("toast").textContent = note;
}
function importJSON(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const next = JSON.parse(reader.result);
      if (!next || !Array.isArray(next.entries) || !Array.isArray(next.categories)) return;
      state = Object.assign(blank(), next); save(); sheet = null; unlocked = !state.pinHash; paint();
    } catch (e) {}
  };
  reader.readAsText(file);
}
function download(text, name, type) {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([text], { type }));
  link.download = name; link.click();
}
document.getElementById("fab").onclick = () => { buzz(); openAdd(); };
document.getElementById("settingsBtn").onclick = () => { if (state.onboarded && unlocked) openSettings(); };
document.getElementById("monthPrev").onclick = () => { view.setMonth(view.getMonth() - 1); paint(); };
document.getElementById("monthNext").onclick = () => { view.setMonth(view.getMonth() + 1); paint(); };
document.getElementById("monthBtn").onclick = () => { view = new Date(); paint(); };
document.querySelectorAll("nav button").forEach(btn => btn.onclick = () => { tab = btn.dataset.tab; paint(); });
paint();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
